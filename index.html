<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MLB Phrase Book — Triple Master Edition</title>

  <!-- ── PWA / iPhone ── -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0a1628" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Phrase Book" />
  <link rel="apple-touch-icon" href="./icon.svg" />

  <!-- Supabase クライアント -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0a1628; --navy-light: #1e3460;
      --gold: #c8a951; --gold-light: #e8c96a; --gold-pale: #fef8e7;
      --red: #c8102e; --white: #f5f5f5;
      --gray-100: #f0f2f5; --gray-200: #e2e6ea; --gray-400: #9aa5b4; --gray-600: #627284;
      --text: #1a2332;
      --es-accent: #c8102e; --es-bg: #fff5f5; --es-border: #f5b8c0;
      --radius: 10px;
      --shadow: 0 2px 12px rgba(10,22,40,.12);
      --shadow-lg: 0 8px 32px rgba(10,22,40,.18);
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--gray-100); color: var(--text); min-height: 100vh; }

    /* Header */
    .header { background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%); color: var(--white); padding: 20px 24px 16px; box-shadow: var(--shadow-lg); }
    .header-inner { max-width: 960px; margin: 0 auto; }
    .header-top { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; }
    .header-icon { width: 44px; height: 44px; background: var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
    .header h1 { font-size: 1.4rem; font-weight: 700; }
    .header-sub { font-size: .78rem; color: var(--gold-light); opacity: .9; margin-left: 58px; }
    .voice-indicator { font-size: .7rem; color: var(--gold-light); opacity: .7; margin-left: 58px; margin-top: 2px; }
    .triple-badge { font-size: .65rem; background: var(--gold); color: var(--navy); border-radius: 10px; padding: 1px 8px; font-weight: 700; letter-spacing: .5px; margin-left: 6px; vertical-align: middle; }

    .main { max-width: 960px; margin: 0 auto; padding: 20px 16px 40px; }

    /* ══ 翻訳パネル ══ */
    .translate-panel { background: #fff; border-radius: 14px; box-shadow: var(--shadow-lg); overflow: hidden; margin-bottom: 24px; border: 1.5px solid var(--gold); }
    .translate-panel-header { background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%); padding: 12px 18px; display: flex; align-items: center; gap: 10px; }
    .translate-panel-header-icon { width: 28px; height: 28px; background: var(--gold); border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
    .translate-panel-title { font-size: .9rem; font-weight: 700; color: #fff; }
    .translate-panel-subtitle { font-size: .72rem; color: var(--gold-light); opacity: .85; margin-left: auto; }
    .translate-body { display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; }
    @media (max-width: 620px) {
      .translate-body { grid-template-columns: 1fr; }
      .translate-divider { height: 36px; border-left: none; border-right: none; border-top: 1px solid var(--gray-200); border-bottom: 1px solid var(--gray-200); }
    }
    .translate-src { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .translate-lang-label { font-size: .7rem; font-weight: 700; color: var(--gray-400); text-transform: uppercase; letter-spacing: .8px; }
    .translate-textarea { flex: 1; border: none; outline: none; resize: none; font-size: .96rem; line-height: 1.6; color: var(--text); font-family: inherit; min-height: 90px; background: transparent; }
    .translate-textarea::placeholder { color: var(--gray-400); }
    .translate-src-footer { display: flex; align-items: center; justify-content: space-between; }
    .translate-clear { background: none; border: none; cursor: pointer; font-size: .75rem; color: var(--gray-400); padding: 4px 8px; border-radius: 6px; }
    .translate-clear:hover { color: var(--red); background: #fdecea; }
    .char-count { font-size: .7rem; color: var(--gray-400); }
    .translate-divider { display: flex; align-items: flex-start; justify-content: center; padding: 20px 4px 0; background: var(--gray-100); border-left: 1px solid var(--gray-200); border-right: 1px solid var(--gray-200); }
    .translate-arrow-icon { width: 28px; height: 28px; border-radius: 50%; background: var(--navy); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13px; }

    /* 右側: 言語ブロックコンテナ */
    .translate-dst { display: flex; flex-direction: column; }
    .lang-block { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
    .lang-block-es { background: var(--es-bg); border-top: 1.5px dashed var(--es-border); }
    .lang-flag-label { font-size: .72rem; font-weight: 700; letter-spacing: .7px; display: flex; align-items: center; gap: 5px; margin-bottom: 2px; }
    .lang-flag-label.en { color: #1e3460; }
    .lang-flag-label.es { color: var(--es-accent); }

    .translate-result-text { font-size: 1.05rem; font-weight: 600; color: var(--navy); line-height: 1.55; min-height: 50px; white-space: pre-wrap; }
    .translate-result-text.placeholder { font-weight: 400; color: var(--gray-400); font-size: .88rem; min-height: 40px; }
    .translate-result-text.loading { color: var(--gray-400); font-size: .88rem; font-style: italic; display: flex; align-items: center; gap: 8px; }
    .translate-result-text.error { color: var(--red); font-size: .85rem; font-weight: 400; }
    .translate-result-text.es-text { color: #8b1a1a; }

    /* IPA 自動生成エリア */
    .translate-ipa-row { display: flex; align-items: center; gap: 8px; min-height: 20px; }
    .translate-ipa-text { font-size: .82rem; color: #5c6e8a; font-family: 'Georgia','Times New Roman',serif; letter-spacing: .3px; }
    .translate-ipa-text.es { color: #8b4513; }
    .translate-ipa-loading { font-size: .75rem; color: var(--gray-400); font-style: italic; display: flex; align-items: center; gap: 6px; }
    .spinner-sm { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--gray-200); border-top-color: var(--navy-light); animation: spin .7s linear infinite; flex-shrink: 0; }

    .lang-speak-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .speak-big-btn { display: flex; align-items: center; gap: 6px; padding: 7px 14px; border: none; border-radius: 8px; background: var(--navy); color: #fff; cursor: pointer; font-size: .82rem; font-weight: 600; transition: background .15s; }
    .speak-big-btn:hover { background: var(--navy-light); }
    .speak-big-btn:disabled { opacity: .4; cursor: default; }
    .speak-big-btn.speaking { background: var(--gold); color: var(--navy); animation: pulse 1s infinite; }
    .speak-big-btn.es-btn { background: var(--es-accent); }
    .speak-big-btn.es-btn:hover { background: #a00d26; }
    .speak-big-btn.es-btn.speaking { background: var(--gold); color: var(--navy); }

    /* 保存ボタン行 */
    .translate-save-row { padding: 10px 16px 14px; border-top: 1px solid var(--gray-200); display: flex; justify-content: flex-end; }
    .save-translate-btn { display: flex; align-items: center; gap: 5px; padding: 9px 18px; border: 1.5px solid var(--gold); border-radius: 8px; background: var(--gold-pale); cursor: pointer; font-size: .85rem; font-weight: 600; color: #7a5c00; }
    .save-translate-btn:hover { background: #fdefc7; }
    .save-translate-btn:disabled { opacity: .4; cursor: default; }
    .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--gray-200); border-top-color: var(--navy-light); animation: spin .7s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toolbar */
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .search-wrap { flex: 1 1 220px; position: relative; }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--gray-400); font-size: 15px; pointer-events: none; }
    .search-input { width: 100%; padding: 10px 12px 10px 36px; border: 1.5px solid var(--gray-200); border-radius: var(--radius); font-size: .92rem; background: #fff; outline: none; transition: border-color .15s; }
    .search-input:focus { border-color: var(--navy-light); }
    .add-btn { padding: 9px 18px; background: var(--gold); border: none; border-radius: var(--radius); font-size: .88rem; font-weight: 600; cursor: pointer; color: var(--navy); white-space: nowrap; }
    .add-btn:hover { background: var(--gold-light); }

    /* Filter row */
    .filter-row { display: flex; gap: 8px; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 6px; scrollbar-width: none; align-items: center; margin-bottom: 14px; }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-btn { padding: 7px 14px; border: 1.5px solid var(--gray-200); border-radius: 20px; background: #fff; font-size: .82rem; cursor: pointer; transition: all .15s; white-space: nowrap; color: var(--gray-600); display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .filter-btn:hover { border-color: var(--navy-light); color: var(--navy); }
    .filter-btn.active { background: var(--navy); border-color: var(--navy); color: #fff; }
    .filter-btn .del-cat { font-size: .65rem; opacity: .6; margin-left: 2px; border: none; background: none; cursor: pointer; padding: 0 2px; color: inherit; }
    .filter-btn .del-cat:hover { opacity: 1; }
    .add-cat-btn { padding: 7px 12px; border: 1.5px dashed var(--gray-400); border-radius: 20px; background: transparent; font-size: .82rem; cursor: pointer; color: var(--gray-600); white-space: nowrap; flex-shrink: 0; }
    .add-cat-btn:hover { border-color: var(--navy-light); color: var(--navy); }

    .stats { font-size: .78rem; color: var(--gray-600); margin-bottom: 12px; }

    /* Cards */
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px,1fr)); gap: 14px; }
    .card { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 16px 0; cursor: pointer; transition: transform .15s, box-shadow .15s; border-top: 3px solid transparent; position: relative; display: flex; flex-direction: column; }
    .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
    .card-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: .7rem; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }
    .card-phrase { font-size: 1rem; font-weight: 600; color: var(--text); line-height: 1.35; margin-bottom: 3px; padding-right: 62px; }
    .card-ipa { font-size: .75rem; color: #5c6e8a; font-family: 'Georgia','Times New Roman',serif; margin-bottom: 2px; }
    .card-reading { font-size: .78rem; color: var(--gray-400); margin-bottom: 6px; }
    /* スペイン語行 */
    .card-es-block { margin: 6px 0 4px; padding: 6px 10px; background: var(--es-bg); border-left: 3px solid var(--es-border); border-radius: 0 6px 6px 0; }
    .card-phrase-es { font-size: .9rem; font-weight: 600; color: #8b1a1a; line-height: 1.35; }
    .card-ipa-es { font-size: .72rem; color: #8b4513; font-family: 'Georgia','Times New Roman',serif; margin-top: 2px; }
    .card-meaning { font-size: .86rem; color: var(--gray-600); line-height: 1.5; border-top: 1px solid var(--gray-200); padding-top: 8px; margin-top: 4px; }
    .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .tag { font-size: .68rem; padding: 2px 7px; background: var(--gray-100); color: var(--gray-600); border-radius: 10px; }
    .card-actions { position: absolute; top: 12px; right: 12px; display: flex; gap: 4px; opacity: 0; transition: opacity .15s; }
    .card:hover .card-actions { opacity: 1; }
    .icon-btn { width: 36px; height: 36px; border: none; background: var(--gray-100); border-radius: 6px; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; transition: background .12s; }
    .icon-btn:hover { background: var(--gray-200); }
    .icon-btn.delete:hover { background: #fdecea; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; border-top: 1px solid var(--gray-200); padding: 8px 0 10px; gap: 6px; }
    .card-speak-group { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
    .speak-btn { display: flex; align-items: center; gap: 5px; padding: 5px 10px; border: 1.5px solid var(--gray-200); border-radius: 20px; background: #fff; cursor: pointer; font-size: .74rem; color: var(--gray-600); transition: all .15s; }
    .speak-btn:hover { border-color: var(--navy-light); color: var(--navy); background: #f0f4ff; }
    .speak-btn.speaking { border-color: var(--gold); color: #7a5c00; background: var(--gold-pale); animation: pulse 1s infinite; }
    .speak-btn.es { border-color: var(--es-border); color: var(--es-accent); }
    .speak-btn.es:hover { border-color: var(--es-accent); background: var(--es-bg); }
    .speak-btn.es.speaking { border-color: var(--gold); color: #7a5c00; background: var(--gold-pale); animation: pulse 1s infinite; }
    .word-toggle-btn { display: flex; align-items: center; gap: 4px; padding: 5px 10px; border: 1.5px solid var(--gray-200); border-radius: 20px; background: #fff; cursor: pointer; font-size: .74rem; color: var(--gray-600); transition: all .15s; flex-shrink: 0; }
    .word-toggle-btn:hover { border-color: var(--navy-light); color: var(--navy); }
    .word-toggle-btn.open { border-color: var(--navy-light); color: var(--navy); background: #f0f4ff; }

    /* Word breakdown */
    .word-breakdown { padding: 10px 0 12px; border-top: 1px solid var(--gray-200); }
    .word-chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .word-chip { display: inline-flex; flex-direction: column; padding: 6px 10px; border: 1.5px solid var(--gray-200); border-radius: 8px; background: var(--gray-100); cursor: pointer; transition: all .15s; }
    .word-chip:hover { border-color: var(--navy-light); background: #eef2fb; }
    .word-chip.speaking { border-color: var(--gold); background: var(--gold-pale); }
    /* 🇪🇸 スペイン語チップ */
    .word-chip.es { border-color: var(--es-border); background: var(--es-bg); }
    .word-chip.es:hover { border-color: var(--es-accent); background: #ffe0e0; }
    .word-chip.es.speaking { border-color: var(--gold); background: var(--gold-pale); }
    .word-chip.es .wc-en { color: #8b1a1a; }
    .word-breakdown-label { font-size: .68rem; font-weight: 700; letter-spacing: .6px; margin: 8px 0 4px; padding: 2px 6px; border-radius: 4px; display: inline-block; }
    .word-breakdown-label.en { color: #1e3460; background: #e8edf8; }
    .word-breakdown-label.es { color: var(--es-accent); background: var(--es-bg); border: 1px solid var(--es-border); }
    /* 詳細モーダル内のスペイン語単語テーブル */
    .wt-word-es { font-weight: 600; color: #8b1a1a; }
    .wt-speak-es { background: var(--es-bg) !important; }
    .wt-speak-es:hover { background: #ffd0d0 !important; }
    .wc-en { font-size: .82rem; font-weight: 600; color: var(--text); }
    .wc-read { font-size: .65rem; color: var(--gray-400); font-style: italic; }
    .wc-ja { font-size: .7rem; color: var(--gray-600); margin-top: 2px; }
    .wc-note { font-size: .62rem; color: var(--gray-400); }

    /* ══ モーダル — iOS Safari スクロール完全対応版 ══
       設計ポイント:
       ① modal-overlay: position:fixed で背景スクロールを遮断
       ② modal: flex列で header/body/footer を縦に並べ高さを制御
       ③ modal-body: flex:1 + min-height:0 が iOS flex スクロールの必須条件
       ④ modal-footer: env(safe-area-inset-bottom) でホームバーを保護
       ⑤ max-height に dvh を使用（iOS Safari のツールバー伸縮を反映）  */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(10,22,40,.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; padding: 16px;
      /* 背景の body がガタガタしないよう下層スクロールを遮断 */
      overscroll-behavior: none;
    }
    .modal {
      background: #fff; border-radius: 14px; width: 100%; max-width: 540px;
      box-shadow: var(--shadow-lg);
      /* overflow:hidden で角丸クリッピング。スクロールは modal-body が担う */
      overflow: hidden;
      /* dvh = Dynamic Viewport Height（iOS Safari のツールバー伸縮を考慮）
         vh フォールバック付きで旧ブラウザにも対応                          */
      max-height: 90vh;
      max-height: 90dvh;
      display: flex; flex-direction: column;
    }
    .modal-sm { max-width: 360px; }
    .modal-header {
      background: var(--navy); color: #fff;
      padding: 16px 20px;
      display: flex; justify-content: space-between; align-items: center;
      flex-shrink: 0;  /* ヘッダーは縮めない */
    }
    .modal-header h2 { font-size: 1rem; font-weight: 600; }
    .modal-close { background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer; opacity: .8; line-height: 1; }
    .modal-close:hover { opacity: 1; }
    .modal-body {
      padding: 20px;
      /* ① flex:1 で残りの高さを全て使う
         ② min-height:0 が必須 — これがないと iOS flex では overflow が効かない */
      flex: 1; min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch; /* iOS 慣性スクロール */
      overscroll-behavior: contain;      /* body への伝播を防ぐ */
    }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: .8rem; font-weight: 600; color: var(--gray-600); margin-bottom: 4px; }
    .form-control { width: 100%; padding: 9px 12px; border: 1.5px solid var(--gray-200); border-radius: 8px; font-size: .9rem; outline: none; transition: border-color .15s; font-family: inherit; }
    .form-control:focus { border-color: var(--navy-light); }
    select.form-control { cursor: pointer; }
    textarea.form-control { resize: vertical; min-height: 70px; }
    .modal-footer {
      /* flex-shrink:0 でフッターが潰れない。ボタンが常に表示される */
      flex-shrink: 0;
      padding: 12px 20px;
      /* env(safe-area-inset-bottom): iPhone ホームバー / ツールバーの高さ分だけ余白を追加
         最低 20px を保証し、ホームバーのあるデバイスは自動で拡張される              */
      padding-bottom: max(20px, calc(env(safe-area-inset-bottom) + 12px));
      display: flex; justify-content: flex-end; gap: 10px;
      background: #fff;
      border-top: 1px solid var(--gray-100); /* スクロール中も区切りが見える */
    }
    .btn-cancel { padding: 8px 18px; border: 1.5px solid var(--gray-200); border-radius: 8px; background: #fff; cursor: pointer; font-size: .88rem; color: var(--gray-600); }
    .btn-cancel:hover { border-color: var(--gray-400); }
    .btn-save { padding: 8px 22px; background: var(--navy); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: .88rem; font-weight: 600; }
    .btn-save:hover { background: var(--navy-light); }

    /* フォームセクション区切り */
    .form-section-label { font-size: .72rem; font-weight: 700; letter-spacing: .7px; padding: 8px 10px 6px; border-radius: 6px; margin: 16px 0 10px; }
    .form-section-label.en { background: #e8edf8; color: #1e3460; }
    .form-section-label.es { background: var(--es-bg); color: var(--es-accent); border: 1px solid var(--es-border); }

    /* Color swatches */
    .color-swatch-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .color-swatch { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform .1s; }
    .color-swatch:hover { transform: scale(1.15); }
    .color-swatch.selected { border-color: var(--navy); transform: scale(1.15); }

    /* Detail modal */
    .detail-phrase { font-size: 1.2rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .detail-ipa { font-size: .85rem; color: #5c6e8a; font-family: 'Georgia','Times New Roman',serif; margin-bottom: 4px; }
    .detail-reading { font-size: .85rem; color: var(--gray-400); margin-bottom: 12px; }
    .detail-speak-row { margin-bottom: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
    .detail-speak-btn { display: flex; align-items: center; gap: 6px; padding: 9px 18px; border: none; border-radius: 8px; background: var(--navy); color: #fff; cursor: pointer; font-size: .88rem; font-weight: 600; }
    .detail-speak-btn:hover { background: var(--navy-light); }
    .detail-speak-btn.speaking { background: var(--gold); color: var(--navy); animation: pulse 1s infinite; }
    .detail-speak-btn.es-btn { background: var(--es-accent); }
    .detail-speak-btn.es-btn:hover { background: #a00d26; }
    /* ES ブロック */
    .detail-es-block { background: var(--es-bg); border: 1.5px solid var(--es-border); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }

    { id:4, phrase:"How's the arm feeling today?", ipa:"/haʊz ðə ɑːrm ˈfiːlɪŋ təˈdeɪ/", reading:"ハウズ ザ アーム フィーリング トゥデイ？", meaning:"今日、腕の調子はどうですか？", phrase_es:"¿Cómo siente el brazo hoy?", ipa_es:"/ˈkomo ˈsjente el ˈbraθo oj/", category:"clubhouse", example:"Hey, how's the arm feeling today after yesterday's start?", tags:["check-in","arm"], starred:true, words:[{w:"How's",r:"ハウズ",m:"どんな状態ですか",note:"How is の短縮"},{w:"arm",r:"アーム",m:"腕",note:"名詞"},{w:"feeling",r:"フィーリング",m:"感じている",note:"進行形"},{w:"today",r:"トゥデイ",m:"今日は",note:"副詞"}], words_es:[{w:"Cómo",r:"",m:"どのように",note:"疑問副詞"},{w:"siente",r:"",m:"感じる",note:"sentirの三人称"},{w:"brazo",r:"",m:"腕",note:"名詞"},{w:"hoy",r:"",m:"今日",note:"副詞"}]},
    { id:5, phrase:"You're all set — go get 'em!", ipa:"/jʊər ɔːl sɛt — ɡoʊ ɡɛt əm/", reading:"ユーアー オール セット — ゴー ゲット エム！", meaning:"準備完了！頑張ってきてください！", phrase_es:"¡Estás listo — ve a por ellos!", ipa_es:"/esˈtas ˈlisto ˈbe a por ˈeʎos/", category:"game-day", example:"That's it for today's warmup. You're all set — go get 'em!", tags:["motivation","pre-game"], starred:false, words:[{w:"You're all set",r:"ユーアー オール セット",m:"準備完了です",note:"慣用表現"},{w:"go get 'em",r:"ゴー ゲット エム",m:"やっつけてこい！",note:"'em = them の口語"}], words_es:[{w:"Estás",r:"",m:"あなたは〜だ",note:"estar二人称"},{w:"listo",r:"",m:"準備完了",note:"形容詞"},{w:"ve",r:"",m:"行け",note:"ir の命令形"},{w:"ellos",r:"",m:"彼ら",note:"三人称複数"}]},

  /* ════════════════════════════════
     Web Speech API — 多言語対応版
  ════════════════════════════════ */
  const PREFERRED_VOICES_EN = ["Google US English","Samantha","Alex","Microsoft Aria Online (Natural) - English (United States)"];
  const PREFERRED_VOICES_ES = ["Google español","Google español de Estados Unidos","Monica","Juan","Paulina","Diego"];

  function useSpeech() {
    const [speakingId,  setSpeakingId]  = useState(null);
    const [voiceName,   setVoiceName]   = useState("");
    const [voiceNameEs, setVoiceNameEs] = useState("");
    const voiceRef   = useRef(null);
    const voiceRefEs = useRef(null);

    const loadVoice = useCallback(() => {
      const voices = window.speechSynthesis?.getVoices() || [];
      if (!voices.length) return;
      // 英語ボイス
      let en = null;
      for (const n of PREFERRED_VOICES_EN) { en = voices.find(v => v.name === n); if (en) break; }
      if (!en) en = voices.find(v => v.lang?.startsWith("en-US")) || voices.find(v => v.lang?.startsWith("en")) || voices[0];
      voiceRef.current = en;
      setVoiceName(en?.name || "");
      // スペイン語ボイス
      let es = null;
      for (const n of PREFERRED_VOICES_ES) { es = voices.find(v => v.name === n); if (es) break; }
      if (!es) es = voices.find(v => v.lang?.startsWith("es-")) || voices.find(v => v.lang?.startsWith("es"));
      voiceRefEs.current = es;
      setVoiceNameEs(es?.name || "");
    }, []);

    useEffect(() => {
      if (!window.speechSynthesis) return;
      loadVoice();
      window.speechSynthesis.onvoiceschanged = loadVoice;
      return () => window.speechSynthesis.cancel();
    }, [loadVoice]);

    /* speak(text, id, lang) — lang: "en-US" | "es-ES" */
    const speak = useCallback((text, id, lang = "en-US") => {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      if (speakingId === id) { setSpeakingId(null); return; }
      const utt  = new SpeechSynthesisUtterance(text);
      const isEs = lang.startsWith("es");
      utt.lang   = lang;
      utt.rate   = isEs ? 0.85 : 0.82;
      utt.pitch  = 1; utt.volume = 1;
      const voice = isEs ? voiceRefEs.current : voiceRef.current;
      if (voice) utt.voice = voice;
      utt.onend  = () => setSpeakingId(null);
      utt.onerror = () => setSpeakingId(null);
      setSpeakingId(id);
      window.speechSynthesis.speak(utt);
    }, [speakingId]);

    return { speakingId, speak, voiceName, voiceNameEs };
  }

      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        {speaking && <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>}
      </svg>
    );
  }

  /* ════════════════════════════════
     英語 IPA 自動生成
     ・dictionaryapi.dev が全単語で失敗した場合は
       フレーズそのもの（"/phrase/"）をフォールバックとして返す
     ・絶対に空文字 "" を返さない
  ════════════════════════════════ */
  async function fetchEnIpa(phrase) {
    try {
      const tokens = phrase.match(/[a-zA-Z]+/g) || [];
      if (!tokens.length) return "/" + phrase + "/";
      const unique = [...new Set(tokens.map(w => w.toLowerCase()))];
      const ipaMap = {};
      await Promise.all(unique.slice(0, 18).map(async (word) => {
        try {
          const r = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
          if (!r.ok) return;
          const d = await r.json();
          if (!Array.isArray(d) || !d[0]) return;
          const entry = d[0];
          let ipa = entry.phonetic;
          if (!ipa && entry.phonetics) { const found = entry.phonetics.find(p => p.text?.trim()); if (found) ipa = found.text; }
          if (ipa) ipaMap[word] = ipa.replace(/^\/|\/$/g, "");
        } catch {}
      }));
      const parts = tokens.map(t => ipaMap[t.toLowerCase()]).filter(Boolean);
      /* API で取れた IPA があればそれを使用、なければフレーズをそのままフォールバック */
      return parts.length ? "/" + parts.join(" ") + "/" : "/" + phrase + "/";
    } catch {
      /* 予期しないエラーでもフォールバックを返す（絶対に "" にしない） */
      return "/" + phrase + "/";
    }
  }

  /* ════════════════════════════════
     共通翻訳関数
     ① Google Translate 非公式 API（安定・高精度）
     ② MyMemory API（フォールバック）
  ════════════════════════════════ */
  async function translateText(text, from, to) {
    /* ── 方法1: Google Translate gtx endpoint ── */
    try {
      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from}&tl=${to}&dt=t&q=${encodeURIComponent(text)}`;
      const res = await fetch(url);
      if (res.ok) {
        const data = await res.json();
        /* レスポンス形式: [[[翻訳チャンク, 原文チャンク,...], ...], ...] */
        if (Array.isArray(data) && Array.isArray(data[0])) {
          const translated = data[0]
            .map(chunk => (Array.isArray(chunk) ? chunk[0] : ""))
            .filter(Boolean)
            .join("");
          if (translated && translated !== text) return translated;
        }
      }
    } catch { /* Google が失敗したら MyMemory へ */ }

    /* ── 方法2: MyMemory API（フォールバック）── */
    /* langpair の "|" は必ず %7C にエンコードする */
    const url2 = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}%7C${to}`;
    const res2  = await fetch(url2);
    const json  = await res2.json();
    /* responseStatus は数値・文字列どちらでも対応 */
    if (Number(json.responseStatus) === 200) {
      const t = json.responseData?.translatedText || "";
      /* 「QUERY LENGTH LIMIT EXCEEDED」など無効な値を弾く */
      if (t && t !== text && !/^QUERY|^MYMEMORY|^\[/i.test(t)) return t;
    }
    throw new Error(`Translation ${from}→${to} failed`);
  }

  /* スペイン語翻訳（後方互換のためラッパーを残す） */
  async function fetchEsTranslation(enText) {
    return translateText(enText, "en", "es");
  }

  /* ════════════════════════════════
     スペイン語 IPA（ベストエフォート）
     ・スペイン語は発音が規則的なため、英語より精度は低くなる場合があります
     ・dictionaryapi.dev が失敗した場合はフレーズそのままをフォールバック
     ・絶対に空文字 "" を返さない
  ════════════════════════════════ */
  async function fetchEsIpa(phrase) {
    try {
      const tokens = phrase.match(/[a-záéíóúüñA-ZÁÉÍÓÚÜÑ]+/gi) || [];
      if (!tokens.length) return "/" + phrase + "/";
      const unique = [...new Set(tokens.map(w => w.toLowerCase()))];
      const ipaMap = {};
      await Promise.all(unique.slice(0, 12).map(async (word) => {
        try {
          const r = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/es/${word}`);
          if (!r.ok) return;
          const d = await r.json();
          if (!Array.isArray(d) || !d[0]) return;
          const entry = d[0];
          let ipa = entry.phonetic;
          if (!ipa && entry.phonetics) { const found = entry.phonetics.find(p => p.text?.trim()); if (found) ipa = found.text; }
          if (ipa) ipaMap[word] = ipa.replace(/^\/|\/$/g, "");
        } catch {}
      }));
      const parts = tokens.map(t => ipaMap[t.toLowerCase()]).filter(Boolean);
      return parts.length ? "/" + parts.join(" ") + "/" : "/" + phrase + "/";
    } catch {
      return "/" + phrase + "/";
    }
  }

  /* ════════════════════════════════
     単語解説 自動生成 共通ユーティリティ
     ・フレーズをトークン分割
     ・改行区切りバッチ翻訳（API 1回のみ）
     ・{w, r, m, note} 配列を返す
     ・API 失敗時はスペース分割フォールバック（絶対に空配列を返さない）
  ════════════════════════════════ */
  async function fetchWordBreakdown(phrase, fromLang, toLang, tokenPattern) {
    if (!phrase) return [];

    /* トークン抽出（フォールバック用にも使用） */
    const rawTokens = phrase.match(tokenPattern) || [];
    if (!rawTokens.length) return [];

    /* 重複除去（元の出現順を保持） */
    const seen = new Set();
    const unique = [];
    for (const t of rawTokens) {
      const k = t.toLowerCase();
      if (!seen.has(k)) { seen.add(k); unique.push(t); }
    }

    /* ── フォールバック: 翻訳なし・スペルのみ（意味は空）──
       API が完全に失敗しても「単語のスペル」は必ず保存される */
    const fallback = unique.slice(0, 14).map(w => ({ w, r: "", m: "", note: "" }));

    try {
      /* 改行区切りバッチ翻訳（toLang）: API コール 1回 */
      const transMap = {};
      const batch  = unique.slice(0, 14).join("\n");
      const result = await translateText(batch, fromLang, toLang);
      result.split("\n").forEach((line, i) => {
        if (unique[i] && line.trim()) transMap[unique[i].toLowerCase()] = line.trim();
      });

      /* 元フレーズの出現順で構築（意味が取れた単語のみ） */
      const built = new Set();
      const translated = rawTokens
        .filter(t => {
          const k = t.toLowerCase();
          if (built.has(k)) return false;
          built.add(k);
          return !!transMap[k];
        })
        .slice(0, 14)
        .map(w => ({ w, r: "", m: transMap[w.toLowerCase()] || "", note: "" }));

      /* 翻訳結果があればそれを使用、なければスペル only フォールバック */
      return translated.length > 0 ? translated : fallback;
    } catch {
      /* API 完全失敗 → スペルのみフォールバック（空配列は絶対に返さない） */
      return fallback;
    }
  }

  /* 英語 単語解説 自動生成 (EN → JA) */
  async function fetchEnWords(enPhrase) {
    return fetchWordBreakdown(enPhrase, "en", "ja", /[a-zA-Z']+/g);
  }

  /* スペイン語 単語解説 自動生成 (ES → JA) */
  async function fetchEsWords(esPhrase) {
    return fetchWordBreakdown(esPhrase, "es", "ja", /[a-záéíóúüñA-ZÁÉÍÓÚÜÑ]+/gi);
  }

  /* ════════════════════════════════════════════════════════════
     OpenAI GPT-4o-mini 一撃パース
     ─────────────────────────────────────────────────────────
     日本語テキストを1回のリクエストで
     EN翻訳・EN IPA・ES翻訳・ES IPA・EN単語解説・ES単語解説
     すべてJSON形式で返す。
  ════════════════════════════════════════════════════════════ */
  async function openAIEnrich(jaText) {
    const apiKey = (localStorage.getItem("openai_api_key") || "").trim();
    if (!apiKey) throw new Error("no_key");

    const prompt =
`You are a language assistant for a Japanese MLB massage therapist.
Given the Japanese phrase below, output a JSON object with EXACTLY these 6 keys.
ALL 6 keys are required — never omit any of them.

{
  "en":       "Natural English translation for a sports medical setting",
  "ipa":      "/IPA transcription of the English phrase, e.g. /wɛr dʌz ɪt hɜːrt//",
  "es":       "Natural Spanish translation for a sports medical setting",
  "ipa_es":   "/IPA transcription of the Spanish phrase, e.g. /ˈdonde le ˈdwele//",
  "words":    [{"w":"EnglishWord","m":"日本語の意味","r":"","note":"品詞メモ"}],
  "words_es": [{"w":"PalabraES","m":"日本語の意味","r":"","note":"品詞メモ"}]
}

IMPORTANT RULES:
1. "ipa"    — REQUIRED. IPA for the English phrase. Wrap in /slashes/.
2. "ipa_es" — REQUIRED. IPA for the Spanish phrase. Wrap in /slashes/. DO NOT omit this field.
3. words / words_es: 3–8 key vocabulary items. note in Japanese (動詞・名詞・形容詞・慣用表現 etc.)
4. r field: always ""

Japanese input: "${jaText}"`;

    const res = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type":  "application/json",
        "Authorization": `Bearer ${apiKey}`,
      },
      body: JSON.stringify({
        model:           "gpt-4o-mini",
        messages:        [{ role: "user", content: prompt }],
        temperature:     0.2,
        max_tokens:      1400,
        response_format: { type: "json_object" },  // JSON出力を強制
      }),
    });

    if (!res.ok) {
      const errBody = await res.json().catch(() => ({}));
      const msg = errBody.error?.message || `HTTP ${res.status}`;
      throw new Error(`OpenAI: ${msg}`);
    }

    const data    = await res.json();
    const content = data.choices?.[0]?.message?.content || "";
    /* response_format:json_object でも念のためコードブロックを除去 */
    const jsonStr = content.replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, "").trim();
    const parsed  = JSON.parse(jsonStr);

    /* ipa_es が欠落していた場合の最終フォールバック */
    if (!parsed.ipa_es && parsed.es) {
      parsed.ipa_es = "/" + parsed.es + "/";
      console.warn("[openAIEnrich] ipa_es missing from GPT response → fallback applied");
    }

    console.log("[openAIEnrich] response:", parsed); // デバッグ用
    return parsed;
  }

  /* ════════════════════════════════════════════════════════════
     翻訳パネル（クリーン再設計版）
     ─────────────────────────────────────────────────────────
     【設計方針】
     ・表示用（JA→EN→ES テキスト）は自動翻訳で随時更新。
     ・IPA・単語解説は「保存ボタンを押した瞬間」に1本の
       async 関数で順番に取得する。事前生成は一切しない。
     ・各ステップは必ず try/catch で囲み、失敗時は
       その場でフォールバック値を確定させてから次へ進む。
     ・全データが揃ったら onSaveRequest を1回だけ呼ぶ。
  ════════════════════════════════════════════════════════════ */
  function TranslatePanel({ onSaveRequest, speakingId, speak }) {
    // ── 表示用ステート（最小限）──
    const [jaText,   setJaText]   = useState("");
    const [enText,   setEnText]   = useState("");
    const [enStatus, setEnStatus] = useState("idle"); // idle|loading|done|error
    const [esText,   setEsText]   = useState("");
    const [esStatus, setEsStatus] = useState("idle");
    const [errMsg,   setErrMsg]   = useState("");
    // ── 保存中の進捗表示 ──
    const [saving,   setSaving]   = useState(false);
    const [saveStep, setSaveStep] = useState("");     // "① IPA取得中..." など
    const timerRef = useRef(null);

    /* ─────────────────────────────────────
       JA → EN 自動翻訳（表示用・700ms デバウンス）
    ───────────────────────────────────── */
    useEffect(() => {
      const q = jaText.trim();
      if (!q) {
        setEnText(""); setEnStatus("idle");
        setEsText(""); setEsStatus("idle"); setErrMsg("");
        return;
      }
      setEnStatus("loading"); setEsText(""); setEsStatus("idle");
      clearTimeout(timerRef.current);
      timerRef.current = setTimeout(async () => {
        try {
          const en = await translateText(q, "ja", "en");
          setEnText(en); setEnStatus("done");
          // EN 成功後に ES も表示用で取得
          if (HAS_ES) {
            setEsStatus("loading");
            try {
              const es = await translateText(en, "en", "es");
              setEsText(es); setEsStatus("done");
            } catch { setEsStatus("error"); }
          }
        } catch {
          setErrMsg("翻訳に失敗しました。ネットワーク接続を確認してください。");
          setEnStatus("error");
        }
      }, 700);
      return () => clearTimeout(timerRef.current);
    }, [jaText]);

    /* ─────────────────────────────────────
       保存ボタン押下 → 全データを順番に取得して1回保存
       ① EN IPA  ② ES IPA  ③ EN 単語解説  ④ ES 単語解説  ⑤ upsert
       各ステップは try/catch で独立。失敗 = フォールバック確定。
    ───────────────────────────────────── */
    const handleSave = async () => {
      if (!jaText.trim() || saving) return;
      setSaving(true);

      const apiKey = (localStorage.getItem("openai_api_key") || "").trim();

      try {
        /* ══════════════════════════════════════════════
           【経路A】OpenAI API キーあり → 一撃パース
           1回のリクエストで全フィールドを取得する
        ══════════════════════════════════════════════ */
        if (apiKey) {
          setSaveStep("🤖 GPT-4o-mini で生成中...");
          try {
            const r = await openAIEnrich(jaText.trim());

            /* GPT レスポンスをフォールバック付きで正規化 */
            const en      = (r.en      || "").trim() || enText || jaText.trim();
            const es      = (r.es      || "").trim();
            const ipa     = (r.ipa     || "").trim() || "/" + en + "/";
            const ipa_es  = (r.ipa_es  || "").trim() || (es ? "/" + es + "/" : "");
            const words   = (Array.isArray(r.words)    && r.words.length    > 0)
              ? r.words
              : en.split(/\s+/).filter(Boolean).map(w => ({ w, m: "", r: "", note: "" }));
            const words_es = (Array.isArray(r.words_es) && r.words_es.length > 0)
              ? r.words_es
              : es.split(/\s+/).filter(Boolean).map(w => ({ w, m: "", r: "", note: "" }));

            setSaveStep("💾 保存中...");
            onSaveRequest({ ja: jaText.trim(), en, ipa, words, es, ipa_es, words_es });
            return; /* 成功 → フォールバックへ進まない */

          } catch (e) {
            /* OpenAI が失敗した場合のみフォールバックへ */
            const msg = e.message === "no_key" ? "APIキー未設定" : e.message;
            console.warn("[OpenAI] failed:", msg, "→ fallback");
            setSaveStep(`⚠ GPT エラー (${msg})。別の方法で保存します...`);
            await new Promise(r => setTimeout(r, 900)); // エラーメッセージを一瞬表示
          }
        }

        /* ══════════════════════════════════════════════
           【経路B】APIキーなし or OpenAI失敗
           → 既存の翻訳API + スペース分割フォールバック
        ══════════════════════════════════════════════ */
        /* EN テキストが表示されていなければ翻訳から実行 */
        let en = enText || "";
        if (!en) {
          setSaveStep("🇺🇸 英語に翻訳中...");
          try { en = await translateText(jaText.trim(), "ja", "en"); } catch {
            en = jaText.trim(); /* 翻訳も失敗したら原文で代用 */
          }
        }

        let es = esText || "";
        if (!es && HAS_ES) {
          setSaveStep("🇪🇸 スペイン語に翻訳中...");
          try { es = await translateText(en, "en", "es"); } catch {}
        }

        setSaveStep("① 🇺🇸 IPA 取得中...");
        let ipa = "/" + en + "/";
        try { const v = await fetchEnIpa(en); if (v) ipa = v; } catch {}

        setSaveStep("② 🇪🇸 IPA 取得中...");
        let ipa_es = es ? "/" + es + "/" : "";
        if (es) { try { const v = await fetchEsIpa(es); if (v) ipa_es = v; } catch {} }

        setSaveStep("③ 🇺🇸 単語解説 生成中...");
        let words = en.split(/\s+/).filter(Boolean).map(w => ({ w, m: "", r: "", note: "" }));
        try { const v = await fetchEnWords(en); if (v && v.length > 0) words = v; } catch {}

        setSaveStep("④ 🇪🇸 単語解説 生成中...");
        let words_es = es.split(/\s+/).filter(Boolean).map(w => ({ w, m: "", r: "", note: "" }));
        if (es) { try { const v = await fetchEsWords(es); if (v && v.length > 0) words_es = v; } catch {} }

        setSaveStep("💾 保存中...");
        onSaveRequest({ ja: jaText.trim(), en, ipa, words, es, ipa_es, words_es });

      } catch (e) {
        console.warn("[handleSave] unexpected error:", e);
      } finally {
        setSaving(false);
        setSaveStep("");
      }
    };

    const clear = () => {
      setJaText(""); setEnText(""); setEnStatus("idle");
      setEsText(""); setEsStatus("idle"); setErrMsg("");
      window.speechSynthesis?.cancel();
    };

    // EN が翻訳済みで、かつ保存処理中でなければ保存可能
    const canSave = enStatus === "done" && !saving;

    /* API モードバッジ（レンダリング時にキーを確認） */
    const hasApiKey = !!(localStorage.getItem("openai_api_key") || "").trim();

    return (
      <div className="translate-panel">
        <div className="translate-panel-header">
          <div className="translate-panel-header-icon">🌐</div>
          <span className="translate-panel-title">日本語 → 英語・スペイン語 自動翻訳</span>
          <span className="translate-panel-subtitle" style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:6}}>
            {hasApiKey
              ? <span className="api-mode-badge openai">🤖 GPT-4o-mini</span>
              : <span className="api-mode-badge fallback">⚙ APIキー未設定</span>
            }
          </span>
        </div>
        <div className="translate-body">
          {/* ── 日本語入力 ── */}
          <div className="translate-src">
            <span className="translate-lang-label">🇯🇵 日本語</span>
            <textarea
              className="translate-textarea"
              placeholder={"日本語で入力してください\n例：どこが一番痛みますか？\n　　肩の力を抜いてください\n　　試合後は20分アイシングしてね"}
              value={jaText}
              onChange={e => setJaText(e.target.value)}
              rows={6}
            />
            <div className="translate-src-footer">
              {jaText && <button className="translate-clear" onClick={clear}>✕ クリア</button>}
              <span className="char-count" style={{marginLeft:"auto"}}>{jaText.length} 字</span>
            </div>
          </div>

          {/* ── 区切り ── */}
          <div className="translate-divider">
            <div className="translate-arrow-icon">→</div>
          </div>

          {/* ── 翻訳結果: EN + ES ── */}
          <div className="translate-dst">
            {/* 🇺🇸 English */}
            {HAS_EN && (
              <div className="lang-block">
                <span className="lang-flag-label en">🇺🇸 English</span>
                {enStatus === "idle"    && <p className="translate-result-text placeholder">日本語を入力すると英語が表示されます</p>}
                {enStatus === "loading" && <p className="translate-result-text loading"><span className="spinner"/>翻訳中...</p>}
                {enStatus === "done"    && <p className="translate-result-text">{enText}</p>}
                {enStatus === "error"   && <p className="translate-result-text error">⚠ {errMsg}</p>}
                {enStatus === "done" && (
                  <div className="lang-speak-row">
                    <button className={`speak-big-btn${speakingId === "tr-en" ? " speaking" : ""}`}
                      onClick={() => speak(enText, "tr-en", "en-US")}>
                      <SpeakerIcon size={14} speaking={speakingId === "tr-en"}/>
                      {speakingId === "tr-en" ? "再生中..." : "🇺🇸 読み上げ"}
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* 🇪🇸 Español */}
            {HAS_ES && (
              <div className="lang-block lang-block-es">
                <span className="lang-flag-label es">🇪🇸 Español</span>
                {esStatus === "idle"    && <p className="translate-result-text placeholder">英語翻訳後に自動でスペイン語を生成します</p>}
                {esStatus === "loading" && <p className="translate-result-text loading"><span className="spinner"/>スペイン語に翻訳中...</p>}
                {esStatus === "done"    && <p className="translate-result-text es-text">{esText}</p>}
                {esStatus === "error"   && <p className="translate-result-text error">⚠ スペイン語翻訳に失敗しました（保存時に再試行します）</p>}
                {esStatus === "done" && (
                  <div className="lang-speak-row">
                    <button className={`speak-big-btn es-btn${speakingId === "tr-es" ? " speaking" : ""}`}
                      onClick={() => speak(esText, "tr-es", "es-ES")}>
                      <SpeakerIcon size={14} speaking={speakingId === "tr-es"}/>
                      {speakingId === "tr-es" ? "再生中..." : "🇪🇸 読み上げ"}
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* 保存ボタン（保存中は進捗メッセージを表示） */}
            <div className="translate-save-row">
              {saving
                ? <span style={{fontSize:".8rem",color:"var(--gray-600)",display:"flex",alignItems:"center",gap:8}}>
                    <span className="spinner-sm"/>{saveStep}
                  </span>
                : <button className="save-translate-btn" disabled={!canSave} onClick={handleSave}>

  /* ════════════════════════════════
     設定モーダル（OpenAI API キー管理）
  ════════════════════════════════ */
  function SettingsModal({ onClose }) {
    const [key,     setKey]     = useState(() => localStorage.getItem("openai_api_key") || "");
    const [saved,   setSaved]   = useState(false);
    const [testing, setTesting] = useState(false);
    const [testMsg, setTestMsg] = useState("");

    const saveKey = () => {
      const trimmed = key.trim();
      if (trimmed) {
        localStorage.setItem("openai_api_key", trimmed);
      } else {
        localStorage.removeItem("openai_api_key");
      }
      setSaved(true);
      setTestMsg("");
      setTimeout(() => setSaved(false), 2500);
    };

    const clearKey = () => {
      localStorage.removeItem("openai_api_key");
      setKey(""); setSaved(false); setTestMsg("");
    };

    /* APIキーが有効かどうかを軽量なリクエストで確認 */
    const testKey = async () => {
      const k = key.trim();
      if (!k) { setTestMsg("❌ キーが空です"); return; }
      setTesting(true); setTestMsg("接続テスト中...");
      try {
        const res = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${k}` },
          body: JSON.stringify({
            model: "gpt-4o-mini",
            messages: [{ role: "user", content: "Reply with just: OK" }],
            max_tokens: 5,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) {
          setTestMsg("✅ 接続成功！GPT-4o-mini が使用できます");
        } else {
          setTestMsg(`❌ エラー: ${data.error?.message || `HTTP ${res.status}`}`);
        }
      } catch (e) {
        setTestMsg(`❌ ネットワークエラー: ${e.message}`);
      } finally {
        setTesting(false);
      }
    };

    const masked = key.length > 10
      ? key.slice(0, 7) + "•".repeat(Math.min(key.length - 10, 20)) + key.slice(-4)
      : key;

    return (
      <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
        <div className="modal modal-sm">
          <div className="modal-header">
            <h2>⚙️ 設定</h2>
            <button className="modal-close" onClick={onClose}>✕</button>
          </div>
          <div className="modal-body">
            <div className="form-group">
              <label>OpenAI API キー</label>
              <input
                type="password"
                className={`form-control settings-key-input`}
                value={key}
                onChange={e => { setKey(e.target.value); setSaved(false); setTestMsg(""); }}
                placeholder="sk-..."
                autoComplete="off"
              />
              {key.length > 10 && (
                <p style={{fontSize:".72rem",color:"var(--gray-400)",marginTop:3}}>
                  {masked}
                </p>
              )}
              <p className="settings-note">
                入力したキーは <strong>ブラウザの localStorage のみ</strong> に保存されます。<br/>
                GitHub やサーバーには一切送信されません。<br/>
                キーを設定すると保存時に <strong style={{color:"#10a37f"}}>GPT-4o-mini</strong> が使われ、
                翻訳・IPA・単語解説を高精度で一括生成します。
              </p>
              {testMsg && (
                <p style={{
                  fontSize:".8rem", marginTop:8, padding:"6px 10px",
                  borderRadius:6,
                  background: testMsg.startsWith("✅") ? "#e8f5e9" : testMsg.startsWith("❌") ? "#fdecea" : "#f5f5f5",
                  color: testMsg.startsWith("✅") ? "#2e7d32" : testMsg.startsWith("❌") ? "#c62828" : "var(--gray-600)",
                }}>
                  {testMsg}
                </p>
              )}
            </div>
          </div>
          <div className="modal-footer" style={{flexWrap:"wrap",gap:8}}>
            {key && <button className="btn-cancel" style={{color:"#c8102e",borderColor:"#f5b8c0"}} onClick={clearKey}>🗑 削除</button>}
            <button className="btn-cancel" onClick={testKey} disabled={testing || !key.trim()}
              style={{borderColor:"var(--navy-light)",color:"var(--navy)"}}>
              {testing ? "テスト中..." : "🔌 接続テスト"}
            </button>
            <button className="btn-cancel" onClick={onClose}>閉じる</button>
            <button className="btn-save" onClick={saveKey}>
              {saved ? "✓ 保存済み！" : "保存"}
            </button>
          </div>
        </div>
      </div>
    );
  }

  /* ════════════════════════════════
     App
  ════════════════════════════════ */
  function App() {
    const [phrases, setPhrases] = useState(() => {
      try { const s = localStorage.getItem("mlb-phrases"); return s ? JSON.parse(s) : INITIAL_PHRASES; } catch { return INITIAL_PHRASES; }
    });
    const [categories, setCategories] = useState(() => {
      try { const s = localStorage.getItem("mlb-categories"); return s ? JSON.parse(s) : DEFAULT_CATEGORIES; } catch { return DEFAULT_CATEGORIES; }
    });

    useEffect(() => { localStorage.setItem("mlb-phrases",    JSON.stringify(phrases));    }, [phrases]);
    useEffect(() => { localStorage.setItem("mlb-categories", JSON.stringify(categories)); }, [categories]);

    /* Supabase 起動時同期 */
    const [syncStatus, setSyncStatus] = useState(db.ready ? "syncing" : "local");
    useEffect(() => {
      if (!db.ready) return;
      db.loadAll().then(result => {
        if (!result) { setSyncStatus("error"); return; }
        const { phrases: sbPhrases, customCats } = result;
        if (sbPhrases.length === 0) {
          const local = (() => { try { return JSON.parse(localStorage.getItem("mlb-phrases")||"[]"); } catch { return []; } })();
          if (local.length > 0) local.forEach(p => db.upsertPhrase(p));
        } else {
          setPhrases(sbPhrases);

          /* ── words / words_es / ipa_es が空のフレーズをバックグラウンドで自動補完 ──
             Supabase に古いデータが残っている場合に対応（1件ずつ処理）。
             ipa_es は supabase_migration_v2 追加時に DEFAULT '' で埋まるため
             既存レコードでも空になっていることがある。                       */
          const needsRegen = sbPhrases.filter(p =>
            (p.phrase    && (p.words    || []).length === 0) ||
            (p.phrase_es && (p.words_es || []).length === 0) ||
            (p.phrase_es && !p.ipa_es)   // ← ipa_es が空のレコードも対象
          );
          if (needsRegen.length > 0) {
            (async () => {
              for (const p of needsRegen) {
                try {
                  const needsWords   = (p.words    || []).length === 0 && !!p.phrase;
                  const needsWordsEs = (p.words_es || []).length === 0 && !!p.phrase_es;
                  const needsIpaEs   = !p.ipa_es && !!p.phrase_es;

                  const [newWords, newWordsEs, newIpaEs] = await Promise.all([
                    needsWords   ? fetchEnWords(p.phrase)    : Promise.resolve(p.words    || []),
                    needsWordsEs ? fetchEsWords(p.phrase_es) : Promise.resolve(p.words_es || []),
                    /* ipa_es: fetchEsIpa は必ず非空を返す（フォールバック付き） */
                    needsIpaEs   ? fetchEsIpa(p.phrase_es)   : Promise.resolve(p.ipa_es   || ""),
                  ]);

                  const upd = { ...p, words: newWords, words_es: newWordsEs, ipa_es: newIpaEs };
                  setPhrases(ps => ps.map(x => x.id === upd.id ? upd : x));
                  await db.upsertPhrase(upd);
                } catch { /* 1件失敗しても次へ続行 */ }
              }
            })();
          }
        }
        if (customCats.length > 0) {
          setCategories(prev => {
            const builtins = prev.filter(c => c.builtIn);
            return [...builtins, ...customCats.filter(c => !builtins.find(b => b.key === c.key))];
          });
        }
        setSyncStatus("ok");
      }).catch(() => setSyncStatus("error"));
    }, []); // eslint-disable-line

    const [isOffline, setIsOffline] = useState(!navigator.onLine);
    useEffect(() => {
      const on  = () => setIsOffline(false);
      const off = () => setIsOffline(true);
      window.addEventListener("online",  on);
      window.addEventListener("offline", off);
      return () => { window.removeEventListener("online", on); window.removeEventListener("offline", off); };
    }, []);

    const [query,          setQuery]      = useState("");
    const [activeCategory, setCategory]   = useState("all");
    const [showAdd,        setShowAdd]    = useState(false);
    const [addPreset,      setAddPreset]  = useState(null);
    const [editTarget,     setEditTarget] = useState(null);
    const [detailTarget,   setDetail]     = useState(null);
    const [openWords,      setOpenWords]  = useState({});
    const [showAddCat,     setShowAddCat] = useState(false);
    const [showSettings,   setShowSettings] = useState(false);

    /* ── モーダルが開いているとき body のスクロールをロック ──
       iOS Safari では overscroll-behavior だけでは不十分なため、
       body.style.overflow = 'hidden' で完全に背景スクロールを止める */
    const anyModalOpen = showSettings || showAddCat || showAdd || !!editTarget || !!detailTarget;
    useEffect(() => {
      document.body.style.overflow = anyModalOpen ? 'hidden' : '';
      return () => { document.body.style.overflow = ''; };
    }, [anyModalOpen]);

    /* detailTarget を phrases の最新状態に同期
       （保存後にモーダルを開き直さなくても最新データが表示される） */
    useEffect(() => {
      if (!detailTarget) return;
      const updated = phrases.find(p => p.id === detailTarget.id);
      if (updated && updated !== detailTarget) setDetail(updated);
    }, [phrases]); // eslint-disable-line

    /* 詳細モーダルを開いたとき words / words_es / ipa_es が空なら即座に再生成 */
    useEffect(() => {
      if (!detailTarget) return;
      const needsEn    = detailTarget.phrase    && (detailTarget.words    || []).length === 0;
      const needsEs    = detailTarget.phrase_es && (detailTarget.words_es || []).length === 0;
      const needsIpaEs = detailTarget.phrase_es && !detailTarget.ipa_es;
      if (!needsEn && !needsEs && !needsIpaEs) return;
      (async () => {
        try {
          const [newWords, newWordsEs, newIpaEs] = await Promise.all([
            needsEn    ? fetchEnWords(detailTarget.phrase)    : Promise.resolve(detailTarget.words    || []),
            needsEs    ? fetchEsWords(detailTarget.phrase_es) : Promise.resolve(detailTarget.words_es || []),
            needsIpaEs ? fetchEsIpa(detailTarget.phrase_es)   : Promise.resolve(detailTarget.ipa_es   || ""),
          ]);
          const upd = { ...detailTarget, words: newWords, words_es: newWordsEs, ipa_es: newIpaEs };
          setPhrases(ps => ps.map(x => x.id === upd.id ? upd : x));
          db.upsertPhrase(upd);
        } catch {}
      })();
    }, [detailTarget?.id]); // eslint-disable-line

    const { speakingId, speak, voiceName, voiceNameEs } = useSpeech();

    const allCategories = useMemo(() => [{ key:"all", label:"すべて", builtIn:true }, ...categories], [categories]);

    const filtered = useMemo(() => {
      const q = query.toLowerCase();
      return phrases.filter(p => {
        const catOk    = activeCategory === "all" || p.category === activeCategory;
        const searchOk = !q || [p.phrase, p.meaning, p.reading, p.ipa||"", p.phrase_es||"", ...(p.tags||[])].some(s => s.toLowerCase().includes(q));
        return catOk && searchOk;
      });
    }, [phrases, query, activeCategory]);

    const savePhrase = (data) => {
      const tags = Array.isArray(data.tags) ? data.tags : data.tags.split(",").map(t=>t.trim()).filter(Boolean);

      /* ── state 保存前の安全装置（DB 側と同じルールを適用） ──
         React state を正しく保ち UI と DB が必ず一致するようにする */
      const safeWords = (arr, src) => {
        if (Array.isArray(arr) && arr.length > 0) return arr;
        return (src || "").split(/\s+/).filter(Boolean).map(w => ({ w, m: "", r: "", note: "" }));
      };
      const safeIpa = (ipa, src) => {
        if (ipa && ipa.trim()) return ipa.trim();
        return src ? "/" + src + "/" : "";
      };

      const normalized = {
        ...data,
        tags,
        ipa:       safeIpa(data.ipa,    data.phrase),
        words:     safeWords(data.words, data.phrase),
        phrase_es: data.phrase_es || "",
        ipa_es:    safeIpa(data.ipa_es,  data.phrase_es),
        words_es:  safeWords(data.words_es, data.phrase_es),
      };
      if (normalized.id) {
        setPhrases(ps => ps.map(p => p.id === normalized.id ? normalized : p));
        db.upsertPhrase(normalized);
      } else {
        const newId  = crypto.randomUUID ? crypto.randomUUID() : String(Date.now());
        const newOne = { ...normalized, id: newId, starred: false };
        setPhrases(ps => [...ps, newOne]);
        db.upsertPhrase(newOne);
      }
      setShowAdd(false); setEditTarget(null); setAddPreset(null);
    };

    const deletePhrase  = (id) => { setPhrases(ps => ps.filter(p => p.id !== id)); db.deletePhrase(id); };
    const toggleStar    = (id, e) => {
      e.stopPropagation();
      setPhrases(ps => ps.map(p => { if (p.id !== id) return p; const u = {...p, starred: !p.starred}; db.upsertPhrase(u); return u; }));
    };
    const toggleWords   = (id, e) => { e.stopPropagation(); setOpenWords(o => ({...o, [id]:!o[id]})); };
    const addCategory   = (cat) => { setCategories(cs => [...cs, cat]); db.upsertCategory(cat); };
    const deleteCategory = (key) => { setCategories(cs => cs.filter(c => c.key !== key)); db.deleteCategory(key); if (activeCategory === key) setCategory("all"); };

    const handleSaveRequest = ({ ja, en, ipa, words, es, ipa_es, words_es }) => {
      setAddPreset({
        phrase:    en,
        meaning:   ja,
        ipa:       ipa     || "",
        reading:   "",
        words:     Array.isArray(words)    ? words    : [],  // 英語 単語解説
        phrase_es: es      || "",
        ipa_es:    ipa_es  || "",
        words_es:  Array.isArray(words_es) ? words_es : [],  // スペイン語 単語解説
        category:  categories[0]?.key || "treatment",
        example:   "",
        tags:      [],
        starred:   false,
      });
      setShowAdd(true);
    };

    const SyncBadge = () => {
      if (!db.ready) return <span style={{fontSize:".68rem",color:"var(--gold-light)",opacity:.7,marginLeft:8}}>💾 ローカル保存</span>;
      if (syncStatus === "syncing") return <span style={{fontSize:".68rem",color:"var(--gold-light)",opacity:.7,marginLeft:8}}>⏳ 同期中...</span>;
      if (syncStatus === "ok")      return <span style={{fontSize:".68rem",color:"#81c784",marginLeft:8}}>☁ Supabase 同期済</span>;
      if (syncStatus === "error")   return <span style={{fontSize:".68rem",color:"#ef9a9a",marginLeft:8}}>⚠ 同期エラー</span>;
      return null;
    };

    return (
      <>
        {isOffline && <div className="offline-banner">📵 オフライン中 — 保存済みフレーズは閲覧・読み上げ可能です</div>}

        <header className="header">
          <div className="header-inner">
            <div className="header-top">
              <div className="header-icon">⚾</div>
              <h1>MLB Phrase Book <span className="triple-badge">TRIPLE</span></h1>
              <button className="settings-btn" onClick={() => setShowSettings(true)} title="設定（APIキー）">⚙</button>
            </div>
            <p className="header-sub">Massage Therapist Edition — 🇯🇵 🇺🇸 🇪🇸 トリプルマスター版</p>
            <p className="voice-indicator" style={{display:"flex",alignItems:"center",flexWrap:"wrap",gap:6}}>
              {voiceName   && <span>🇺🇸 {voiceName}</span>}
              {voiceNameEs && <span>🇪🇸 {voiceNameEs}</span>}
              <SyncBadge />
            </p>
          </div>
        </header>

        <main className="main">
          <TranslatePanel onSaveRequest={handleSaveRequest} speakingId={speakingId} speak={speak} />

          <div className="toolbar">
            <div className="search-wrap">
              <span className="search-icon">🔍</span>
              <input className="search-input" placeholder="英語・スペイン語・意味・タグで検索..." value={query} onChange={e => setQuery(e.target.value)} />
            </div>
            <button className="add-btn" onClick={() => { setAddPreset(null); setShowAdd(true); }}>＋ フレーズ追加</button>
          </div>

          <div className="filter-row">
            {allCategories.map(c => {
              const col      = c.key === "all" ? null : palColor(c.paletteIdx ?? 0);
              const isActive = activeCategory === c.key;
              return (
                <button key={c.key} className={`filter-btn${isActive ? " active" : ""}`}
                  style={isActive && col ? { background: col.border, borderColor: col.border, color: "#fff" } : {}}
                  onClick={() => setCategory(c.key)}>
                  {c.label}
                  {!c.builtIn && (
                    <span className="del-cat" onClick={e => { e.stopPropagation(); deleteCategory(c.key); }} title="グループを削除">✕</span>
                  )}
                </button>
              );
            })}
            <button className="add-cat-btn" onClick={() => setShowAddCat(true)}>＋ グループ追加</button>
          </div>

          <p className="stats">{filtered.length} 件表示（全 {phrases.length} フレーズ）</p>

          {filtered.length === 0 ? (
            <div className="empty"><div className="empty-icon">📭</div><p>フレーズが見つかりませんでした。</p></div>
          ) : (
            <div className="card-grid">
              {filtered.map(p => {
                const sid      = `card-${p.id}`;
                const sidEs    = `card-${p.id}-es`;
                const cat      = categories.find(c => c.key === p.category);
                const col      = palColor(cat?.paletteIdx ?? 0);
                const wordsOpen = !!openWords[p.id];
                return (
                  <div key={p.id} className="card" style={{ borderTopColor: col.border }} onClick={() => setDetail(p)}>
                    <div className="card-actions">
                      <button className="icon-btn" title={p.starred?"スター解除":"スター"} onClick={e => toggleStar(p.id, e)}>{p.starred?"⭐":"☆"}</button>
                      <button className="icon-btn" title="編集" onClick={e => { e.stopPropagation(); setEditTarget(p); }}>✏️</button>
                      <button className="icon-btn delete" title="削除" onClick={e => { e.stopPropagation(); deletePhrase(p.id); }}>🗑</button>
                    </div>
                    <span className="card-badge" style={{ background: col.bg, color: col.text }}>{cat?.label || p.category}</span>
                    {/* 🇺🇸 English */}
                    {HAS_EN && <p className="card-phrase">{p.phrase}</p>}
                    {HAS_EN && p.ipa     && <p className="card-ipa">{p.ipa}</p>}
                    {HAS_EN && p.reading && <p className="card-reading">{p.reading}</p>}
                    {/* 🇪🇸 Español */}
                    {HAS_ES && p.phrase_es && (
                      <div className="card-es-block">
                        <p className="card-phrase-es">🇪🇸 {p.phrase_es}</p>
                        {p.ipa_es && <p className="card-ipa-es">{p.ipa_es}</p>}
                      </div>
                    )}
                    {p.meaning && <p className="card-meaning">{p.meaning}</p>}
                    {(p.tags||[]).length > 0 && (
                      <div className="card-tags">
                        {p.tags.map(t => <span key={t} className="tag">{t}</span>)}
                        {p.starred && <span className="tag" style={{background:"#fef8e7",color:"#7a5c00"}}>⭐</span>}
                      </div>
                    )}
                    {wordsOpen && (
                      <>
                        {(p.words||[]).length > 0 && (
                          <>
                            <span className="word-breakdown-label en">🇺🇸 English</span>
                            <WordChips words={p.words} speakingId={speakingId} speak={speak} phraseId={p.id} lang="en-US"/>
                          </>
                        )}
                        {HAS_ES && (p.words_es||[]).length > 0 && (
                          <>
                            <span className="word-breakdown-label es">🇪🇸 Español</span>
                            <WordChips words={p.words_es} speakingId={speakingId} speak={speak} phraseId={`${p.id}-es`} lang="es-ES"/>
                          </>
                        )}
                      </>
                    )}
                    <div className="card-footer" onClick={e => e.stopPropagation()}>
                      <div className="card-speak-group">
                        {HAS_EN && (
                          <button className={`speak-btn${speakingId===sid?" speaking":""}`} onClick={() => speak(p.phrase, sid, "en-US")}>
                            <SpeakerIcon speaking={speakingId===sid}/> EN
                          </button>
                        )}
                        {HAS_ES && p.phrase_es && (
                          <button className={`speak-btn es${speakingId===sidEs?" speaking":""}`} onClick={() => speak(p.phrase_es, sidEs, "es-ES")}>
                            <SpeakerIcon speaking={speakingId===sidEs}/> ES
                          </button>
                        )}
                      </div>
                      {((p.words||[]).length > 0 || (HAS_ES && (p.words_es||[]).length > 0)) && (
                        <button className={`word-toggle-btn${wordsOpen?" open":""}`} onClick={e => toggleWords(p.id, e)}>
                          📖 {wordsOpen?"▲":"▼"}
                        </button>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </main>

        {showSettings  && <SettingsModal onClose={() => setShowSettings(false)} />}
        {showAddCat && <AddCategoryModal onAdd={addCategory} onClose={() => setShowAddCat(false)} usedIdxs={categories.map(c => c.paletteIdx)} />}
        {showAdd && <PhraseModal phrase={addPreset} onSave={savePhrase} onClose={() => { setShowAdd(false); setAddPreset(null); }} categories={categories} />}
        {editTarget && <PhraseModal phrase={editTarget} onSave={savePhrase} onClose={() => setEditTarget(null)} categories={categories} />}
        {detailTarget && <DetailModal phrase={detailTarget} onClose={() => setDetail(null)} onEdit={p => setEditTarget(p)} onDelete={id => deletePhrase(id)} speakingId={speakingId} speak={speak} categories={categories} />}
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<!-- ── Service Worker 登録 ── -->
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js")
        .then(r => console.log("[SW] registered:", r.scope))
        .catch(e => console.warn("[SW] registration failed:", e));
    });
  }
</script>
</body>
</html>
