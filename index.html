<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MLB Phrase Book — Massage Therapist Edition</title>

  <!-- ── PWA / iPhone ── -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0a1628" />
  <!-- iOS ホーム画面アイコン・全画面起動 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Phrase Book" />
  <link rel="apple-touch-icon" href="./icon.svg" />

  <!-- Supabase クライアント -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <!-- 本番ビルド（開発版より約80%軽量） -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0a1628; --navy-light: #1e3460;
      --gold: #c8a951; --gold-light: #e8c96a; --gold-pale: #fef8e7;
      --red: #c8102e; --white: #f5f5f5;
      --gray-100: #f0f2f5; --gray-200: #e2e6ea; --gray-400: #9aa5b4; --gray-600: #627284;
      --text: #1a2332;
      --radius: 10px;
      --shadow: 0 2px 12px rgba(10,22,40,.12);
      --shadow-lg: 0 8px 32px rgba(10,22,40,.18);
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--gray-100); color: var(--text); min-height: 100vh; }

    /* Header */
    .header { background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%); color: var(--white); padding: 20px 24px 16px; box-shadow: var(--shadow-lg); }
    .header-inner { max-width: 960px; margin: 0 auto; }
    .header-top { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; }
    .header-icon { width: 44px; height: 44px; background: var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
    .header h1 { font-size: 1.4rem; font-weight: 700; }
    .header-sub { font-size: .78rem; color: var(--gold-light); opacity: .9; margin-left: 58px; }
    .voice-indicator { font-size: .7rem; color: var(--gold-light); opacity: .7; margin-left: 58px; margin-top: 2px; }

    .main { max-width: 960px; margin: 0 auto; padding: 20px 16px 40px; }

    /* ══ 翻訳パネル ══ */
    .translate-panel { background: #fff; border-radius: 14px; box-shadow: var(--shadow-lg); overflow: hidden; margin-bottom: 24px; border: 1.5px solid var(--gold); }
    .translate-panel-header { background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%); padding: 12px 18px; display: flex; align-items: center; gap: 10px; }
    .translate-panel-header-icon { width: 28px; height: 28px; background: var(--gold); border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
    .translate-panel-title { font-size: .9rem; font-weight: 700; color: #fff; }
    .translate-panel-subtitle { font-size: .72rem; color: var(--gold-light); opacity: .85; margin-left: auto; }
    .translate-body { display: grid; grid-template-columns: 1fr auto 1fr; min-height: 160px; }
    @media (max-width: 580px) {
      .translate-body { grid-template-columns: 1fr; }
      .translate-divider { height: 36px; border-left: none; border-right: none; border-top: 1px solid var(--gray-200); border-bottom: 1px solid var(--gray-200); }
    }
    .translate-src { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .translate-lang-label { font-size: .7rem; font-weight: 700; color: var(--gray-400); text-transform: uppercase; letter-spacing: .8px; }
    .translate-textarea { flex: 1; border: none; outline: none; resize: none; font-size: .96rem; line-height: 1.6; color: var(--text); font-family: inherit; min-height: 90px; background: transparent; }
    .translate-textarea::placeholder { color: var(--gray-400); }
    .translate-src-footer { display: flex; align-items: center; justify-content: space-between; }
    .translate-clear { background: none; border: none; cursor: pointer; font-size: .75rem; color: var(--gray-400); padding: 4px 8px; border-radius: 6px; }
    .translate-clear:hover { color: var(--red); background: #fdecea; }
    .char-count { font-size: .7rem; color: var(--gray-400); }
    .translate-divider { display: flex; align-items: center; justify-content: center; padding: 0 4px; background: var(--gray-100); border-left: 1px solid var(--gray-200); border-right: 1px solid var(--gray-200); }
    .translate-arrow-icon { width: 28px; height: 28px; border-radius: 50%; background: var(--navy); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13px; }
    .translate-dst { padding: 16px; display: flex; flex-direction: column; gap: 8px; background: #f8faff; }
    .translate-result-en { font-size: 1.05rem; font-weight: 600; color: var(--navy); line-height: 1.55; min-height: 90px; flex: 1; white-space: pre-wrap; }
    .translate-result-en.placeholder { font-weight: 400; color: var(--gray-400); font-size: .9rem; }
    .translate-result-en.loading { color: var(--gray-400); font-size: .88rem; font-style: italic; display: flex; align-items: center; gap: 8px; }
    .translate-result-en.error { color: var(--red); font-size: .85rem; font-weight: 400; }

    /* IPA 自動生成エリア */
    .translate-ipa-row { display: flex; align-items: center; gap: 8px; min-height: 22px; margin: 4px 0 2px; }
    .translate-ipa-text { font-size: .82rem; color: #5c6e8a; font-family: 'Georgia','Times New Roman',serif; letter-spacing: .3px; }
    .translate-ipa-loading { font-size: .75rem; color: var(--gray-400); font-style: italic; display: flex; align-items: center; gap: 6px; }
    .spinner-sm { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--gray-200); border-top-color: var(--navy-light); animation: spin .7s linear infinite; flex-shrink: 0; }

    .translate-dst-footer { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .speak-big-btn { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border: none; border-radius: 8px; background: var(--navy); color: #fff; cursor: pointer; font-size: .85rem; font-weight: 600; transition: background .15s; }
    .speak-big-btn:hover { background: var(--navy-light); }
    .speak-big-btn:disabled { opacity: .4; cursor: default; }
    .speak-big-btn.speaking { background: var(--gold); color: var(--navy); animation: pulse 1s infinite; }
    .save-translate-btn { display: flex; align-items: center; gap: 5px; padding: 8px 14px; border: 1.5px solid var(--gold); border-radius: 8px; background: var(--gold-pale); cursor: pointer; font-size: .82rem; font-weight: 600; color: #7a5c00; }
    .save-translate-btn:hover { background: #fdefc7; }
    .save-translate-btn:disabled { opacity: .4; cursor: default; }
    .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--gray-200); border-top-color: var(--navy-light); animation: spin .7s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toolbar */
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .search-wrap { flex: 1 1 220px; position: relative; }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--gray-400); font-size: 15px; pointer-events: none; }
    .search-input { width: 100%; padding: 10px 12px 10px 36px; border: 1.5px solid var(--gray-200); border-radius: var(--radius); font-size: .92rem; background: #fff; outline: none; transition: border-color .15s; }
    .search-input:focus { border-color: var(--navy-light); }
    .add-btn { padding: 9px 18px; background: var(--gold); border: none; border-radius: var(--radius); font-size: .88rem; font-weight: 600; cursor: pointer; color: var(--navy); white-space: nowrap; }
    .add-btn:hover { background: var(--gold-light); }

    /* Filter row + グループ追加 */
    .filter-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
    .filter-btn { padding: 7px 14px; border: 1.5px solid var(--gray-200); border-radius: 20px; background: #fff; font-size: .82rem; cursor: pointer; transition: all .15s; white-space: nowrap; color: var(--gray-600); display: flex; align-items: center; gap: 5px; }
    .filter-btn:hover { border-color: var(--navy-light); color: var(--navy); }
    .filter-btn.active { background: var(--navy); border-color: var(--navy); color: #fff; }
    .filter-btn .del-cat { font-size: .65rem; opacity: .6; margin-left: 2px; border: none; background: none; cursor: pointer; padding: 0 2px; color: inherit; }
    .filter-btn .del-cat:hover { opacity: 1; }
    .add-cat-btn { padding: 7px 12px; border: 1.5px dashed var(--gray-400); border-radius: 20px; background: transparent; font-size: .82rem; cursor: pointer; color: var(--gray-600); white-space: nowrap; }
    .add-cat-btn:hover { border-color: var(--navy-light); color: var(--navy); }

    .stats { font-size: .78rem; color: var(--gray-600); margin-bottom: 12px; }

    /* Cards */
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px,1fr)); gap: 14px; }
    .card { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 16px 0; cursor: pointer; transition: transform .15s, box-shadow .15s; border-top: 3px solid transparent; position: relative; display: flex; flex-direction: column; }
    .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
    .card-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: .7rem; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }
    .card-phrase { font-size: 1rem; font-weight: 600; color: var(--text); line-height: 1.35; margin-bottom: 3px; padding-right: 62px; }
    .card-ipa { font-size: .75rem; color: #5c6e8a; font-family: 'Georgia','Times New Roman',serif; margin-bottom: 4px; }
    .card-reading { font-size: .78rem; color: var(--gray-400); margin-bottom: 8px; }
    .card-meaning { font-size: .86rem; color: var(--gray-600); line-height: 1.5; border-top: 1px solid var(--gray-200); padding-top: 8px; }
    .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
    .tag { font-size: .68rem; padding: 2px 7px; background: var(--gray-100); color: var(--gray-600); border-radius: 10px; }
    .card-actions { position: absolute; top: 12px; right: 12px; display: flex; gap: 4px; opacity: 0; transition: opacity .15s; }
    .card:hover .card-actions { opacity: 1; }
    .icon-btn { width: 26px; height: 26px; border: none; background: var(--gray-100); border-radius: 6px; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; transition: background .12s; }
    .icon-btn:hover { background: var(--gray-200); }
    .icon-btn.delete:hover { background: #fdecea; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; border-top: 1px solid var(--gray-200); padding: 8px 0 12px; }
    .speak-btn { display: flex; align-items: center; gap: 5px; padding: 5px 10px; border: 1.5px solid var(--gray-200); border-radius: 20px; background: #fff; cursor: pointer; font-size: .74rem; color: var(--gray-600); transition: all .15s; }
    .speak-btn:hover { border-color: var(--navy-light); color: var(--navy); background: #f0f4ff; }
    .speak-btn.speaking { border-color: var(--gold); color: #7a5c00; background: var(--gold-pale); animation: pulse 1s infinite; }
    .word-toggle-btn { display: flex; align-items: center; gap: 4px; padding: 5px 10px; border: 1.5px solid var(--gray-200); border-radius: 20px; background: #fff; cursor: pointer; font-size: .74rem; color: var(--gray-600); transition: all .15s; }
    .word-toggle-btn:hover { border-color: var(--navy-light); color: var(--navy); }
    .word-toggle-btn.open { border-color: var(--navy-light); color: var(--navy); background: #f0f4ff; }

    /* Word breakdown */
    .word-breakdown { padding: 10px 0 12px; border-top: 1px solid var(--gray-200); }
    .word-chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .word-chip { display: inline-flex; flex-direction: column; padding: 6px 10px; border: 1.5px solid var(--gray-200); border-radius: 8px; background: var(--gray-100); cursor: pointer; transition: all .15s; }
    .word-chip:hover { border-color: var(--navy-light); background: #eef2fb; }
    .word-chip.speaking { border-color: var(--gold); background: var(--gold-pale); }
    .wc-en { font-size: .82rem; font-weight: 600; color: var(--text); }
    .wc-read { font-size: .65rem; color: var(--gray-400); font-style: italic; }
    .wc-ja { font-size: .7rem; color: var(--gray-600); margin-top: 2px; }
    .wc-note { font-size: .62rem; color: var(--gray-400); }

    /* Modals */
    .modal-overlay { position: fixed; inset: 0; background: rgba(10,22,40,.5); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
    .modal { background: #fff; border-radius: 14px; width: 100%; max-width: 520px; box-shadow: var(--shadow-lg); overflow: hidden; max-height: 92vh; display: flex; flex-direction: column; }
    .modal-sm { max-width: 360px; }
    .modal-header { background: var(--navy); color: #fff; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    .modal-header h2 { font-size: 1rem; font-weight: 600; }
    .modal-close { background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer; opacity: .8; line-height: 1; }
    .modal-close:hover { opacity: 1; }
    .modal-body { padding: 20px; overflow-y: auto; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: .8rem; font-weight: 600; color: var(--gray-600); margin-bottom: 4px; }
    .form-control { width: 100%; padding: 9px 12px; border: 1.5px solid var(--gray-200); border-radius: 8px; font-size: .9rem; outline: none; transition: border-color .15s; font-family: inherit; }
    .form-control:focus { border-color: var(--navy-light); }
    select.form-control { cursor: pointer; }
    textarea.form-control { resize: vertical; min-height: 70px; }
    .modal-footer { padding: 12px 20px 20px; display: flex; justify-content: flex-end; gap: 10px; flex-shrink: 0; }
    .btn-cancel { padding: 8px 18px; border: 1.5px solid var(--gray-200); border-radius: 8px; background: #fff; cursor: pointer; font-size: .88rem; color: var(--gray-600); }
    .btn-cancel:hover { border-color: var(--gray-400); }
    .btn-save { padding: 8px 22px; background: var(--navy); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: .88rem; font-weight: 600; }
    .btn-save:hover { background: var(--navy-light); }

    /* Color swatches */
    .color-swatch-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .color-swatch { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform .1s; }
    .color-swatch:hover { transform: scale(1.15); }
    .color-swatch.selected { border-color: var(--navy); transform: scale(1.15); }

    /* Detail modal */
    .detail-phrase { font-size: 1.2rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .detail-ipa { font-size: .85rem; color: #5c6e8a; font-family: 'Georgia','Times New Roman',serif; margin-bottom: 4px; }
    .detail-reading { font-size: .85rem; color: var(--gray-400); margin-bottom: 12px; }
    .detail-speak-row { margin-bottom: 16px; }
    .detail-speak-btn { display: flex; align-items: center; gap: 6px; padding: 9px 18px; border: none; border-radius: 8px; background: var(--navy); color: #fff; cursor: pointer; font-size: .88rem; font-weight: 600; }
    .detail-speak-btn:hover { background: var(--navy-light); }
    .detail-speak-btn.speaking { background: var(--gold); color: var(--navy); animation: pulse 1s infinite; }
    .detail-section { margin-bottom: 14px; }
    .detail-label { font-size: .73rem; font-weight: 700; color: var(--gray-400); text-transform: uppercase; letter-spacing: .7px; margin-bottom: 6px; }
    .detail-value { font-size: .9rem; color: var(--text); line-height: 1.55; }
    .detail-example { font-style: italic; color: var(--navy-light); font-size: .88rem; }
    .word-table { width: 100%; border-collapse: collapse; font-size: .84rem; }
    .word-table th { text-align: left; font-size: .7rem; font-weight: 600; color: var(--gray-400); text-transform: uppercase; letter-spacing: .5px; padding: 0 8px 6px 0; border-bottom: 1px solid var(--gray-200); }
    .word-table td { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--gray-100); vertical-align: top; }
    .word-table tr:last-child td { border-bottom: none; }
    .wt-word { font-weight: 600; color: var(--text); }
    .wt-read { font-size: .75rem; color: var(--gray-400); font-style: italic; display: block; margin-top: 1px; }
    .wt-ja { color: var(--gray-600); }
    .wt-note { font-size: .74rem; color: #7b91b0; padding: 1px 7px; background: #eef2fb; border-radius: 10px; }
    .wt-speak { width: 28px; height: 28px; border: none; border-radius: 6px; background: var(--gray-100); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .wt-speak:hover { background: #dde3ec; }
    .wt-speak.speaking { background: var(--gold-pale); }

    .empty { text-align: center; padding: 60px 20px; color: var(--gray-400); }
    .empty-icon { font-size: 3rem; margin-bottom: 12px; }
    .empty p { font-size: .92rem; }

    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }

    /* ══ iPhone / モバイル最適化 ══ */

    /* Safe area（ノッチ・ホームバー対応） */
    .header { padding-top: max(20px, env(safe-area-inset-top)); }
    .main   { padding-bottom: max(40px, calc(env(safe-area-inset-bottom) + 24px)); }

    /* フィルター行: 横スクロール */
    .filter-row {
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 6px;
      scrollbar-width: none;
    }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-btn, .add-cat-btn { flex-shrink: 0; }

    /* タッチターゲット最小 44px */
    .speak-btn, .word-toggle-btn, .filter-btn, .add-btn, .add-cat-btn,
    .speak-big-btn, .save-translate-btn, .btn-save, .btn-cancel { min-height: 44px; }
    .icon-btn { width: 36px; height: 36px; }

    /* スマホ: 1カラム */
    @media (max-width: 520px) {
      .card-grid { grid-template-columns: 1fr; }
      .header h1 { font-size: 1.2rem; }
      .translate-body { grid-template-columns: 1fr; }
      .translate-divider {
        border-left: none; border-right: none;
        border-top: 1px solid var(--gray-200); border-bottom: 1px solid var(--gray-200);
        height: 36px; padding: 0;
      }
      .translate-arrow-icon { transform: rotate(90deg); }
      .translate-dst-footer { gap: 8px; }
      .speak-big-btn, .save-translate-btn { flex: 1; justify-content: center; }
      .modal { border-radius: 18px 18px 0 0; max-height: 95vh; position: fixed; bottom: 0; left: 0; right: 0; width: 100%; }
      .modal-overlay { align-items: flex-end; }
    }

    /* オフラインバナー */
    .offline-banner {
      background: #7b1fa2; color: #fff;
      text-align: center; font-size: .78rem; padding: 6px 16px;
      position: sticky; top: 0; z-index: 200;
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { useState, useMemo, useCallback, useEffect, useRef } = React;

  /* ══════════════════════════════════════════════════════════
     ▼▼▼  Supabase 設定  ▼▼▼
     Supabase Dashboard > Settings > API からコピーしてください
     https://supabase.com/dashboard/project/＜your-project＞/settings/api
  ══════════════════════════════════════════════════════════ */
  const SUPABASE_URL      = "https://YOUR_PROJECT_ID.supabase.co"; // ← 変更
  const SUPABASE_ANON_KEY = "YOUR_ANON_KEY";                       // ← 変更
  /* ══════════════════════════════════════════════════════════ */

  /* Supabase クライアント（未設定なら null → localStorage のみで動作） */
  const sb = (() => {
    try {
      if (!SUPABASE_URL.includes("YOUR") && window.supabase) {
        return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch {}
    return null;
  })();

  /* ── DB ヘルパー ────────────────────────────────────────── */
  const db = {
    ready: !!sb,

    /* フレーズを JS オブジェクト形式に変換（DB → App） */
    _fromRow: (r) => ({ ...r, tags: r.tags || [], words: r.words || [] }),

    /* フレーズを DB 行形式に変換（App → DB） */
    _toRow: (p) => ({
      id: p.id, phrase: p.phrase, ipa: p.ipa || "", reading: p.reading || "",
      meaning: p.meaning || "", category: p.category, example: p.example || "",
      tags: Array.isArray(p.tags) ? p.tags : [],
      starred: !!p.starred,
      words: p.words || [],
    }),

    async loadAll() {
      if (!sb) return null;
      const [pr, ca] = await Promise.all([
        sb.from("phrases").select("*").order("created_at"),
        sb.from("categories").select("*").order("sort_order").eq("built_in", false),
      ]);
      return {
        phrases:    (pr.data || []).map(this._fromRow),
        customCats: (ca.data || []).map(r => ({ key: r.key, label: r.label, paletteIdx: r.palette_idx, builtIn: false })),
      };
    },

    async upsertPhrase(p) {
      if (!sb) return;
      const { error } = await sb.from("phrases").upsert(this._toRow(p));
      if (error) console.warn("[Supabase] upsertPhrase:", error.message);
    },

    async deletePhrase(id) {
      if (!sb) return;
      const { error } = await sb.from("phrases").delete().eq("id", id);

  /* ════════════════════════════════
     Web Speech API
  ════════════════════════════════ */
  const PREFERRED_VOICES = ["Google US English","Samantha","Alex","Microsoft Aria Online (Natural) - English (United States)"];

  function useSpeech() {
    const [speakingId, setSpeakingId] = useState(null);
    const [voiceName,  setVoiceName]  = useState("");
    const voiceRef = useRef(null);

    const loadVoice = useCallback(() => {
      const voices = window.speechSynthesis?.getVoices() || [];
      if (!voices.length) return;
      let chosen = null;
      for (const name of PREFERRED_VOICES) { chosen = voices.find(v => v.name === name); if (chosen) break; }
      if (!chosen) chosen = voices.find(v => v.lang?.startsWith("en-US")) || voices.find(v => v.lang?.startsWith("en")) || voices[0];
      voiceRef.current = chosen;
      setVoiceName(chosen?.name || "");
    }, []);

    useEffect(() => {
      if (!window.speechSynthesis) return;
      loadVoice();
      window.speechSynthesis.onvoiceschanged = loadVoice;
      return () => window.speechSynthesis.cancel();
    }, [loadVoice]);

    const speak = useCallback((text, id) => {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      if (speakingId === id) { setSpeakingId(null); return; }
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = "en-US"; utt.rate = 0.82; utt.pitch = 1; utt.volume = 1;
      if (voiceRef.current) utt.voice = voiceRef.current;
      utt.onend = () => setSpeakingId(null);
      utt.onerror = () => setSpeakingId(null);
      setSpeakingId(id);
      window.speechSynthesis.speak(utt);
    }, [speakingId]);

    return { speakingId, speak, voiceName };
  }

  }

  /* ════════════════════════════════
     IPA 自動生成（Free Dictionary API）
  ════════════════════════════════ */
  async function fetchPhraseIpa(phrase) {
    const tokens = phrase.match(/[a-zA-Z]+/g) || [];
    if (!tokens.length) return "";

    const unique = [...new Set(tokens.map(w => w.toLowerCase()))];
    const ipaMap = {};

    await Promise.all(unique.slice(0, 18).map(async (word) => {
      try {
        const r = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
        if (!r.ok) return;
        const d = await r.json();
        if (!Array.isArray(d) || !d[0]) return;
        const entry = d[0];
        let ipa = entry.phonetic;
        if (!ipa && entry.phonetics) {
          const found = entry.phonetics.find(p => p.text && p.text.trim());
          if (found) ipa = found.text;
        }
        if (ipa) ipaMap[word] = ipa.replace(/^\/|\/$/g, "");
      } catch {}
    }));

    const parts = tokens.map(t => ipaMap[t.toLowerCase()]).filter(Boolean);
    if (!parts.length) return "";
    return "/" + parts.join(" ") + "/";
  }

  /* ════════════════════════════════
     翻訳パネル
  ════════════════════════════════ */
  function TranslatePanel({ onSaveRequest, speakingId, speak }) {
    const [jaText,    setJaText]    = useState("");
    const [enText,    setEnText]    = useState("");
    const [status,    setStatus]    = useState("idle");   // idle|loading|done|error
    const [errMsg,    setErrMsg]    = useState("");
    const [ipaText,   setIpaText]   = useState("");
    const [ipaStatus, setIpaStatus] = useState("idle");   // idle|loading|done
    const timerRef = useRef(null);
    const SPEAK_ID = "translate-result";

    /* 翻訳（日本語 → 英語） */
    useEffect(() => {
      const q = jaText.trim();
      if (!q) { setEnText(""); setStatus("idle"); setIpaText(""); setIpaStatus("idle"); return; }
      setStatus("loading");
      setIpaText(""); setIpaStatus("idle");
      clearTimeout(timerRef.current);
      timerRef.current = setTimeout(async () => {
        try {
          const res  = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(q)}&langpair=ja|en`);
          const json = await res.json();
          if (json.responseStatus === 200) {
            setEnText(json.responseData.translatedText);
            setStatus("done");
          } else {
            setErrMsg("翻訳に失敗しました。"); setStatus("error");
          }
        } catch {
          setErrMsg("ネットワークに接続できません。"); setStatus("error");
        }
      }, 700);
      return () => clearTimeout(timerRef.current);
    }, [jaText]);

    /* 翻訳完了後に IPA を自動生成 */
    useEffect(() => {
      if (status !== "done" || !enText) return;
      setIpaStatus("loading");
      fetchPhraseIpa(enText).then(ipa => {
        setIpaText(ipa);
        setIpaStatus("done");
      }).catch(() => setIpaStatus("done"));
    }, [status, enText]);

    const clear = () => {
      setJaText(""); setEnText(""); setStatus("idle");
      setIpaText(""); setIpaStatus("idle");
      window.speechSynthesis?.cancel();
    };

    return (
      <div className="translate-panel">
        <div className="translate-panel-header">
          <div className="translate-panel-header-icon">🌐</div>
          <span className="translate-panel-title">日本語 → 英語 リアルタイム翻訳</span>
          <span className="translate-panel-subtitle">翻訳 → 発音記号 → 読み上げを自動生成</span>
        </div>
        <div className="translate-body">
          <div className="translate-src">
            <span className="translate-lang-label">日本語</span>
            <textarea
              className="translate-textarea"
              placeholder={"日本語で入力してください\n例：どこが一番痛みますか？\n　　肩の力を抜いてください\n　　試合後は20分アイシングしてね"}
              value={jaText}
              onChange={e => setJaText(e.target.value)}
              rows={5}
            />
            <div className="translate-src-footer">
              {jaText && <button className="translate-clear" onClick={clear}>✕ クリア</button>}
              <span className="char-count" style={{marginLeft:"auto"}}>{jaText.length} 字</span>
            </div>
          </div>
          <div className="translate-divider">
            <div className="translate-arrow-icon">→</div>
          </div>
          <div className="translate-dst">
            <span className="translate-lang-label">English</span>
            {status === "idle"    && <p className="translate-result-en placeholder">左に日本語を入力すると英語が表示されます</p>}
            {status === "loading" && <p className="translate-result-en loading"><span className="spinner"/>翻訳中...</p>}
            {status === "done"    && <p className="translate-result-en">{enText}</p>}
            {status === "error"   && <p className="translate-result-en error">⚠ {errMsg}</p>}

            {/* IPA 表示 */}
            <div className="translate-ipa-row">
              {ipaStatus === "loading" && (
                <span className="translate-ipa-loading"><span className="spinner-sm"/>発音記号を生成中...</span>
              )}
              {ipaStatus === "done" && ipaText && (
                <span className="translate-ipa-text">{ipaText}</span>
              )}
            </div>

            <div className="translate-dst-footer">
              <button
                className={`speak-big-btn${speakingId === SPEAK_ID ? " speaking" : ""}`}
                disabled={status !== "done"}
                onClick={() => speak(enText, SPEAK_ID)}
              >
                <SpeakerIcon size={15} speaking={speakingId === SPEAK_ID}/>
                {speakingId === SPEAK_ID ? "再生中..." : "読み上げ"}
              </button>
              <button
                className="save-translate-btn"
                disabled={status !== "done"}
                onClick={() => onSaveRequest({ ja: jaText.trim(), en: enText, ipa: ipaText })}
                title="フレーズ帳に保存"
              >
                ＋ フレーズ帳に保存
              </button>
            </div>
          </div>
        </div>
      </div>
    );
  }

    const col = palColor(cat?.paletteIdx ?? 0);
    return (
      <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
        <div className="modal">
          <div className="modal-header"><h2>フレーズ詳細</h2><button className="modal-close" onClick={onClose}>✕</button></div>
          <div className="modal-body">
            <span className="card-badge" style={{background:col.bg,color:col.text,marginBottom:10,display:"inline-block"}}>{cat?.label || phrase.category}</span>
            <p className="detail-phrase">{phrase.phrase}</p>
            {phrase.ipa     && <p className="detail-ipa">{phrase.ipa}</p>}
            {phrase.reading && <p className="detail-reading">{phrase.reading}</p>}
            <div className="detail-speak-row">
              <button className={`detail-speak-btn${speakingId===sid?" speaking":""}`} onClick={() => speak(phrase.phrase, sid)}>
                <SpeakerIcon size={15} speaking={speakingId===sid}/>
                {speakingId===sid ? "再生中..." : "フレーズを読み上げ"}
              </button>
            </div>
            {phrase.meaning && <div className="detail-section"><p className="detail-label">日本語訳</p><p className="detail-value">{phrase.meaning}</p></div>}
            {phrase.example && <div className="detail-section"><p className="detail-label">例文</p><p className="detail-example">"{phrase.example}"</p></div>}
            {(phrase.words||[]).length > 0 && (
              <div className="detail-section">
                <p className="detail-label">単語・フレーズ解説</p>
                <table className="word-table">
                  <thead><tr><th>単語</th><th>意味</th><th>品詞メモ</th><th></th></tr></thead>
                  <tbody>
                    {phrase.words.map((w, i) => {
                      const wid = `wt-${phrase.id}-${i}`;
                      return (
                        <tr key={i}>
                          <td><span className="wt-word">{w.w}</span>{w.r && <span className="wt-read">{w.r}</span>}</td>
                          <td><span className="wt-ja">{w.m}</span></td>
                          <td>{w.note && <span className="wt-note">{w.note}</span>}</td>
                          <td><button className={`wt-speak${speakingId===wid?" speaking":""}`} onClick={() => speak(w.w, wid)}><SpeakerIcon size={13} speaking={speakingId===wid}/></button></td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
            {(phrase.tags||[]).length > 0 && (
              <div className="detail-section"><p className="detail-label">タグ</p><div className="card-tags" style={{marginTop:4}}>{phrase.tags.map(t=><span key={t} className="tag">{t}</span>)}</div></div>
            )}
          </div>
          <div className="modal-footer">
            <button className="btn-cancel" style={{color:"#c8102e",borderColor:"#f5b8c0"}} onClick={() => { onDelete(phrase.id); onClose(); }}>削除</button>
            <button className="btn-cancel" onClick={onClose}>閉じる</button>
            <button className="btn-save" onClick={() => { onClose(); onEdit(phrase); }}>編集</button>
          </div>
        </div>
      </div>
    );
  }

  /* ════════════════════════════════
     App
  ════════════════════════════════ */
  function App() {
    /* ── localStorage から復元（初回のみ） ── */
    const [phrases, setPhrases] = useState(() => {
      try {
        const s = localStorage.getItem("mlb-phrases");
        return s ? JSON.parse(s) : INITIAL_PHRASES;
      } catch { return INITIAL_PHRASES; }
    });
    const [categories, setCategories] = useState(() => {
      try {
        const s = localStorage.getItem("mlb-categories");
        return s ? JSON.parse(s) : DEFAULT_CATEGORIES;
      } catch { return DEFAULT_CATEGORIES; }
    });

    /* ── localStorage に変更を自動保存 ── */
    useEffect(() => { localStorage.setItem("mlb-phrases",    JSON.stringify(phrases));    }, [phrases]);
    useEffect(() => { localStorage.setItem("mlb-categories", JSON.stringify(categories)); }, [categories]);

    /* ── 起動時: Supabase からデータ取得 → localStorage と同期 ── */
    const [syncStatus, setSyncStatus] = useState(db.ready ? "syncing" : "local"); // local|syncing|ok|error
    useEffect(() => {
      if (!db.ready) return;
      db.loadAll().then(result => {
        if (!result) { setSyncStatus("error"); return; }
        const { phrases: sbPhrases, customCats } = result;

        if (sbPhrases.length === 0) {
          /* Supabase が空 → ローカルデータを初回アップロード */
          const local = (() => { try { return JSON.parse(localStorage.getItem("mlb-phrases")||"[]"); } catch { return []; } })();
          if (local.length > 0) local.forEach(p => db.upsertPhrase(p));
        } else {
          /* Supabase にデータあり → ローカルを上書き（Supabase が正） */
          setPhrases(sbPhrases);
        }

        if (customCats.length > 0) {
          setCategories(prev => {
            const builtins = prev.filter(c => c.builtIn);
            const merged   = [...builtins, ...customCats.filter(c => !builtins.find(b => b.key === c.key))];
            return merged;
          });
        }
        setSyncStatus("ok");
      }).catch(() => setSyncStatus("error"));
    }, []); // eslint-disable-line

    /* ── オフライン検知 ── */
    const [isOffline, setIsOffline] = useState(!navigator.onLine);
    useEffect(() => {
      const on  = () => setIsOffline(false);
      const off = () => setIsOffline(true);
      window.addEventListener("online",  on);
      window.addEventListener("offline", off);
      return () => { window.removeEventListener("online", on); window.removeEventListener("offline", off); };
    }, []);

    const [query,          setQuery]          = useState("");
    const [activeCategory, setCategory]       = useState("all");
    const [showAdd,        setShowAdd]        = useState(false);
    const [addPreset,      setAddPreset]      = useState(null);
    const [editTarget,     setEditTarget]     = useState(null);
    const [detailTarget,   setDetail]         = useState(null);
    const [openWords,      setOpenWords]      = useState({});
    const [showAddCat,     setShowAddCat]     = useState(false);

    const { speakingId, speak, voiceName } = useSpeech();

    const allCategories = useMemo(() => [{ key:"all", label:"すべて", builtIn:true }, ...categories], [categories]);

    const filtered = useMemo(() => {
      const q = query.toLowerCase();
      return phrases.filter(p => {
        const catOk    = activeCategory === "all" || p.category === activeCategory;
        const searchOk = !q || [p.phrase, p.meaning, p.reading, p.ipa||"", ...(p.tags||[])].some(s => s.toLowerCase().includes(q));
        return catOk && searchOk;
      });
    }, [phrases, query, activeCategory]);

    const savePhrase = (data) => {
      const tags       = Array.isArray(data.tags) ? data.tags : data.tags.split(",").map(t=>t.trim()).filter(Boolean);
      const normalized = { ...data, tags, words: data.words || [] };
      if (normalized.id) {
        /* 既存フレーズを更新 */
        setPhrases(ps => ps.map(p => p.id === normalized.id ? normalized : p));
        db.upsertPhrase(normalized);
      } else {
        /* 新規フレーズ: UUID を生成 */
        const newId  = crypto.randomUUID ? crypto.randomUUID() : String(Date.now());
        const newOne = { ...normalized, id: newId, starred: false };
        setPhrases(ps => [...ps, newOne]);
        db.upsertPhrase(newOne);
      }
      setShowAdd(false); setEditTarget(null); setAddPreset(null);
    };

    const deletePhrase = (id) => {
      setPhrases(ps => ps.filter(p => p.id !== id));
      db.deletePhrase(id);
    };

    const toggleStar = (id, e) => {
      e.stopPropagation();
      setPhrases(ps => ps.map(p => {
        if (p.id !== id) return p;
        const updated = { ...p, starred: !p.starred };
        db.upsertPhrase(updated);
        return updated;
      }));
    };

    const toggleWords = (id, e) => { e.stopPropagation(); setOpenWords(o => ({...o, [id]:!o[id]})); };

    const addCategory = (cat) => {
      setCategories(cs => [...cs, cat]);
      db.upsertCategory(cat);
    };
    const deleteCategory = (key) => {
      setCategories(cs => cs.filter(c => c.key !== key));
      db.deleteCategory(key);
      if (activeCategory === key) setCategory("all");
    };

    const handleSaveRequest = ({ ja, en, ipa }) => {
      setAddPreset({ phrase: en, meaning: ja, ipa: ipa || "", reading:"", category: categories[0]?.key || "treatment", example:"", tags:[], starred:false, words:[] });
      setShowAdd(true);
    };

    /* ── Supabase 同期ステータスバッジ ── */
    const SyncBadge = () => {
      if (!db.ready) return <span style={{fontSize:".68rem",color:"var(--gold-light)",opacity:.7,marginLeft:8}}>💾 ローカル保存</span>;
      if (syncStatus === "syncing") return <span style={{fontSize:".68rem",color:"var(--gold-light)",opacity:.7,marginLeft:8}}>⏳ 同期中...</span>;
      if (syncStatus === "ok")      return <span style={{fontSize:".68rem",color:"#81c784",marginLeft:8}}>☁ Supabase 同期済</span>;
      if (syncStatus === "error")   return <span style={{fontSize:".68rem",color:"#ef9a9a",marginLeft:8}}>⚠ 同期エラー</span>;
      return null;
    };

    return (
      <>
        {isOffline && (
          <div className="offline-banner">
            📵 オフライン中 — 保存済みフレーズは閲覧・読み上げ可能です
          </div>
        )}
        <header className="header">
          <div className="header-inner">
            <div className="header-top">
              <div className="header-icon">⚾</div>
              <h1>MLB Phrase Book</h1>
            </div>
            <p className="header-sub">Massage Therapist Edition — クラブハウス・治療現場の英語フレーズ集</p>
            <p className="voice-indicator" style={{display:"flex",alignItems:"center",flexWrap:"wrap",gap:4}}>
              {voiceName && <span>🔊 {voiceName}</span>}
              <SyncBadge />
            </p>
          </div>
        </header>

        <main className="main">
          <TranslatePanel onSaveRequest={handleSaveRequest} speakingId={speakingId} speak={speak} />

          <div className="toolbar">
            <div className="search-wrap">
              <span className="search-icon">🔍</span>
              <input className="search-input" placeholder="フレーズ・意味・IPA・タグで検索..." value={query} onChange={e => setQuery(e.target.value)} />
            </div>
            <button className="add-btn" onClick={() => { setAddPreset(null); setShowAdd(true); }}>＋ フレーズ追加</button>
          </div>

          {/* グループフィルター */}
          <div className="filter-row">
            {allCategories.map(c => {
              const col = c.key === "all" ? null : palColor(c.paletteIdx ?? 0);
              const isActive = activeCategory === c.key;
              return (
                <button
                  key={c.key}
                  className={`filter-btn${isActive ? " active" : ""}`}
                  style={isActive && col ? { background: col.border, borderColor: col.border, color: "#fff" } : {}}
                  onClick={() => setCategory(c.key)}
                >
                  {c.label}
                  {!c.builtIn && (
                    <span className="del-cat" onClick={e => { e.stopPropagation(); deleteCategory(c.key); }} title="グループを削除">✕</span>
                  )}
                </button>
              );
            })}
            <button className="add-cat-btn" onClick={() => setShowAddCat(true)}>＋ グループ追加</button>
          </div>

          <p className="stats">{filtered.length} 件表示（全 {phrases.length} フレーズ）</p>

          {filtered.length === 0 ? (
            <div className="empty"><div className="empty-icon">📭</div><p>フレーズが見つかりませんでした。</p></div>
          ) : (
            <div className="card-grid">
              {filtered.map(p => {
                const sid = `card-${p.id}`;
                const cat = categories.find(c => c.key === p.category);
                const col = palColor(cat?.paletteIdx ?? 0);
                const wordsOpen = !!openWords[p.id];
                return (
                  <div key={p.id} className="card" style={{ borderTopColor: col.border }} onClick={() => setDetail(p)}>
                    <div className="card-actions">
                      <button className="icon-btn" title={p.starred?"スター解除":"スター"} onClick={e => toggleStar(p.id, e)}>{p.starred?"⭐":"☆"}</button>
                      <button className="icon-btn" title="編集" onClick={e => { e.stopPropagation(); setEditTarget(p); }}>✏️</button>
                      <button className="icon-btn delete" title="削除" onClick={e => { e.stopPropagation(); deletePhrase(p.id); }}>🗑</button>
                    </div>
                    <span className="card-badge" style={{ background: col.bg, color: col.text }}>{cat?.label || p.category}</span>
                    <p className="card-phrase">{p.phrase}</p>
                    {p.ipa     && <p className="card-ipa">{p.ipa}</p>}
                    {p.reading && <p className="card-reading">{p.reading}</p>}
                    {p.meaning && <p className="card-meaning">{p.meaning}</p>}
                    {(p.tags||[]).length > 0 && (
                      <div className="card-tags">
                        {p.tags.map(t => <span key={t} className="tag">{t}</span>)}
                        {p.starred && <span className="tag" style={{background:"#fef8e7",color:"#7a5c00"}}>⭐</span>}
                      </div>
                    )}
                    {wordsOpen && <WordChips words={p.words} speakingId={speakingId} speak={speak} phraseId={p.id}/>}
                    <div className="card-footer" onClick={e => e.stopPropagation()}>
                      <button className={`speak-btn${speakingId===sid?" speaking":""}`} onClick={() => speak(p.phrase, sid)}>
                        <SpeakerIcon speaking={speakingId===sid}/>
                        {speakingId===sid ? "再生中..." : "読み上げ"}
                      </button>
                      {(p.words||[]).length > 0 && (
                        <button className={`word-toggle-btn${wordsOpen?" open":""}`} onClick={e => toggleWords(p.id, e)}>
                          📖 単語解説 {wordsOpen?"▲":"▼"}
                        </button>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </main>

        {/* グループ追加モーダル */}
        {showAddCat && (
          <AddCategoryModal
            onAdd={addCategory}
            onClose={() => setShowAddCat(false)}
            usedIdxs={categories.map(c => c.paletteIdx)}
          />
        )}

        {/* フレーズ追加・編集モーダル */}
        {showAdd && (
          <PhraseModal
            phrase={addPreset}
            onSave={savePhrase}
            onClose={() => { setShowAdd(false); setAddPreset(null); }}
            categories={categories}
          />
        )}
        {editTarget && (
          <PhraseModal
            phrase={editTarget}
            onSave={savePhrase}
            onClose={() => setEditTarget(null)}
            categories={categories}
          />
        )}

        {/* 詳細モーダル */}
        {detailTarget && (
          <DetailModal
            phrase={detailTarget}
            onClose={() => setDetail(null)}
            onEdit={p => setEditTarget(p)}
            onDelete={id => deletePhrase(id)}
            speakingId={speakingId}
            speak={speak}
            categories={categories}
          />
        )}
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<!-- ── Service Worker 登録 ── -->
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js")
        .then(r => console.log("[SW] registered:", r.scope))
        .catch(e => console.warn("[SW] registration failed:", e));
    });
  }
</script>
</body>
</html>
